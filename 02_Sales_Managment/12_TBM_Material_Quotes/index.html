<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TBM 자재 단가 비교">
    <title>TBM 자재 단가 비교</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="../supply-common.css">
    <link rel="stylesheet" href="tbm-material-quotes.css">
</head>

<body style="background: var(--gray-50); display: flex; flex-direction: column; height: 100vh; overflow: hidden; margin: 0;">
    
    <!-- ================= LIST VIEW ================= -->
    <div id="listView" style="display: flex; flex-direction: column; height: 100%;">
        <header class="app-bar" style="flex-shrink: 0; padding: 16px 24px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center;">
            <div class="app-bar-left">
                <div style="font-size: 12px; color: var(--gray-500); font-weight: 700; margin-bottom: 4px; letter-spacing: 0.5px; text-transform: uppercase;"><i class='bx bx-git-compare'></i> 비교 견적 대시보드</div>
                <h1 style="margin: 0; font-size: 24px; font-weight: 800; color: var(--gray-900); letter-spacing: -0.5px;">TBM 자재 단가 비교</h1>
            </div>
            <div class="app-bar-right">
                <button class="btn btn-primary" style="display: flex; align-items: center; gap: 6px;" onclick="createNewDocument()">
                    <i class='bx bx-plus'></i> 새 견적서 작성
                </button>
            </div>
        </header>
        
        <main style="flex: 1; overflow: auto; padding: 24px 32px;">
            <div class="table-container" style="background: #fff; border: 1px solid var(--gray-200); border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
                <table class="data-table" style="width: 100%;">
                    <thead>
                        <tr>
                            <th style="width: 100px; text-align: center;">상태</th>
                            <th>문서 제목</th>
                            <th style="width: 200px;">생성일시</th>
                            <th style="width: 80px; text-align: center;">관리</th>
                        </tr>
                    </thead>
                    <tbody id="documentListBody">
                        <!-- Loaded documents -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- ================= DETAIL VIEW ================= -->
    <div id="detailView" style="display: none; flex-direction: column; height: 100%; background: #fff;">
        <!-- Top App Bar -->
        <header class="app-bar" style="flex-shrink: 0; padding: 16px 24px; background: #fff; border-bottom: 1px solid var(--gray-200); display: flex; justify-content: space-between; align-items: center;">
            <div class="app-bar-left" style="display: flex; align-items: center; gap: 20px;">
                <button class="btn btn-outline" style="padding: 6px 12px; border: none; color: var(--gray-600); background: var(--gray-100);" onclick="showListView()">
                    <i class='bx bx-arrow-back'></i> 목록
                </button>
                <div style="width: 1px; height: 24px; background: var(--gray-200);"></div>
                <div>
                    <input type="text" id="documentTitle" placeholder="문서 제목을 입력하세요 (예: 24년 8월 TBM 단가표)" style="width: 320px; border: none; font-size: 20px; font-weight: 800; color: var(--gray-900); outline: none; background: transparent;">
                </div>
            </div>
            <div class="app-bar-right" style="display: flex; gap: 12px; align-items: center;">
                <button class="btn btn-outline" style="color: var(--gray-600); display: flex; align-items: center; gap: 6px; border: none; background: var(--gray-100);" onclick="clearTable()">
                    <i class='bx bx-trash'></i> 초기화
                </button>
                <button class="btn btn-outline" style="border-color: #64748b; color: #64748b; display: flex; align-items: center; gap: 6px;" onclick="prepareAndPrint()">
                    <i class='bx bx-printer'></i> 인쇄
                </button>
                <button class="btn btn-outline" style="border-color: #3b82f6; color: #3b82f6; display: flex; align-items: center; gap: 6px;" onclick="saveDocument('draft')">
                    <i class='bx bx-save'></i> 임시 저장
                </button>
                <button class="btn btn-primary" style="display: flex; align-items: center; gap: 6px;" onclick="saveDocument('completed')">
                    <i class='bx bx-check-double'></i> 최종 완료
                </button>
            </div>
        </header>

        <!-- Main Table Area -->
        <main style="flex: 1; overflow: hidden; display: flex; flex-direction: column;">
            <div class="table-container" style="flex: 1; background: #fff; overflow: auto; box-shadow: inset 0 2px 4px 0 rgba(0,0,0,0.02);">
                <table id="quoteTable" class="data-table quote-matrix-table" style="min-width: 1200px; border-collapse: separate; border-spacing: 0;">
                    <thead>
                        <tr id="tableHeaderRow">
                            <th class="sticky-col" style="left: 0; z-index: 10; width: 60px; text-align: center;">No.</th>
                            <th class="sticky-col" style="left: 60px; z-index: 10; width: 140px;">식별번호</th>
                            <th class="sticky-col" style="left: 200px; z-index: 10; width: 180px;">품명</th>
                            <th class="sticky-col" style="left: 380px; z-index: 10; width: 150px;">규격</th>
                            <th class="sticky-col" style="left: 530px; z-index: 10; width: 120px;">투입 현장</th>
                            <th class="sticky-col" style="left: 650px; z-index: 10; width: 90px; text-align: right;">수량</th>
                            <th class="sticky-col" style="left: 740px; z-index: 10; width: 60px; text-align: center; border-right: 1px solid var(--border-color);">단위</th>
                            <th id="addSupplierTh" class="filler-col" style="width: 150px; text-align: center; background: #f8fafc; color: var(--primary); cursor: pointer;" onclick="addSupplierColumn()">
                                <i class='bx bx-plus'></i> 업체(공급사) 추가
                            </th>
                        </tr>
                    </thead>
                    <tbody id="quoteTableBody">
                        <!-- Rows will be injected here -->
                        <tr id="emptyStateRow">
                            <td colspan="8" style="text-align: center; padding: 60px 20px; color: var(--gray-400);">
                                <i class='bx bx-box' style="font-size: 48px; margin-bottom: 16px; opacity: 0.5;"></i>
                                <p style="font-size: 15px; font-weight: 500;">견적 비교할 항목이 없습니다.</p>
                                <p style="font-size: 13px; margin-top: 8px;">현장별 현황에서 자재를 내보내기 하거나 직접 입력해 주세요.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- ================= PRINT VIEW ================= -->
    <div id="printContainer" class="print-only"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../../Common/js/auth.js"></script>
    <script src="tbm-material-quotes.js"></script>
</body>
</html>
