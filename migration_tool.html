<!DOCTYPE html>
<html>
<head><title>마이그레이션 실행</title></head>
<body style="font-family:sans-serif; padding:40px; text-align:center;">
<h2>거래처명 마이그레이션 도구</h2>
<p>아래 버튼을 누르면 기존 직출고 데이터의 텍스트 거래처명을 공식 명칭으로 변환합니다.</p>
<button id="btn" onclick="runMigration()" style="padding:15px 40px; font-size:18px; background:#4CAF50; color:white; border:none; border-radius:8px; cursor:pointer;">마이그레이션 실행</button>
<div id="result" style="margin-top:30px; padding:20px; font-size:16px;"></div>
<script>
async function runMigration() {
    const btn = document.getElementById('btn');
    const result = document.getElementById('result');
    btn.disabled = true;
    btn.textContent = '실행 중...';
    result.innerHTML = '서버에 요청 중입니다. 잠시만 기다려 주세요...';

    try {
        // 1단계: 로그인해서 토큰 가져오기
        const id = prompt('KNG 로그인 아이디를 입력해 주세요:');
        const pw = prompt('KNG 로그인 비밀번호를 입력해 주세요:');
        if (!id || !pw) { result.innerHTML = '로그인 정보가 입력되지 않았습니다.'; btn.disabled = false; btn.textContent = '마이그레이션 실행'; return; }
        
        const loginRes = await fetch('https://kng.junparks.com/api/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: id, password: pw})
        });
        const loginData = await loginRes.json();
        if (!loginData.token) { result.innerHTML = '<span style="color:red;">로그인 실패: ' + (loginData.error || '알 수 없는 오류') + '</span>'; btn.disabled = false; btn.textContent = '마이그레이션 실행'; return; }

        // 2단계: 마이그레이션 API 호출
        const res = await fetch('https://kng.junparks.com/api/logistics/migrate-partners', {
            headers: {'Authorization': 'Bearer ' + loginData.token}
        });
        const data = await res.json();
        
        if (data.success) {
            result.innerHTML = '<span style="color:green; font-weight:bold;">✅ ' + data.message + '</span><br><br>' +
                '입고(Inbound) 변환: <b>' + data.inboundUpdated + '건</b><br>' +
                '출고(Outbound) 변환: <b>' + data.outboundUpdated + '건</b>';
        } else {
            result.innerHTML = '<span style="color:orange;">⚠️ ' + (data.message || JSON.stringify(data)) + '</span>';
        }
    } catch(e) {
        result.innerHTML = '<span style="color:red;">❌ 오류 발생: ' + e.message + '</span>';
    }
    btn.disabled = false;
    btn.textContent = '다시 실행';
}
</script>
</body>
</html>
