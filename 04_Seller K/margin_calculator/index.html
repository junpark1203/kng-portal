<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <base href="../../">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마진 계산기 - K&G 포털</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="04_Seller K/margin_calculator/styles.css">
    <style>
        /* 포털 전용: 사이드바 없이 전체 너비 사용 */
        .main-content { margin-left: 0; padding-top: 20px; background-color: #f8fafc; }
    </style>
</head>
<body>
    <div class="app-container" id="mainApp">
        <div class="main-content" id="mainContent">
            <div class="page-body" style="max-width: 1200px; margin: 0 auto; padding: 20px;">
                
                <!-- 헤더 영역 -->
                <div class="header-section">
                    <h2>마진 및 판매가 계산기</h2>
                    <p>매입원가와 수수료를 반영하여 최적의 판매가를 시뮬레이션하고 내역을 관리하세요.</p>
                </div>

                <!-- 레이아웃 컨테이너 (좌측: 입력, 우측: 결과) -->
                <div class="layout-grid">
                    
                    <!-- 좌측: 입력 폼 영역 -->
                    <div class="input-panel">
                        <!-- 상품명 입력란 -->
                        <div class="product-name-section">
                            <label>상품명 <span class="badge-optional">선택</span></label>
                            <input type="text" id="fldProductName" placeholder="계산 내역을 저장하려면 상품명을 입력하세요">
                        </div>

                        <div class="cards-grid">
                            <!-- 매입 정보 카드 -->
                            <div class="premium-card">
                                <div class="card-header">
                                    <div class="icon-wrapper bg-blue"><i class='bx bx-purchase-tag'></i></div>
                                    <h3>매입 정보</h3>
                                </div>
                                <div class="card-body">
                                    <div class="fg">
                                        <label>매입가 <span class="hint">(기본: 공급가)</span></label>
                                        <div class="input-wrapper">
                                            <input type="number" id="fldBuyPrice" placeholder="0" min="0">
                                            <span class="unit">원</span>
                                        </div>
                                    </div>
                                    <div class="fg">
                                        <label>매입 배송비 <span class="hint">(기본: 공급가)</span></label>
                                        <div class="input-wrapper">
                                            <input type="number" id="fldBuyShipping" placeholder="0" min="0">
                                            <span class="unit">원</span>
                                        </div>
                                    </div>
                                    <label class="toggle-checkbox">
                                        <input type="checkbox" id="chkBuyVat">
                                        <div class="toggle-switch"></div>
                                        <span>매입 부가세 10% 포함 (공급대가)</span>
                                    </label>
                                    
                                    <div class="divider"></div>
                                    
                                    <div class="fg">
                                        <label>기타 고정 지출 <span class="hint">(선택)</span></label>
                                        <div class="input-wrapper">
                                            <input type="number" id="fldExtraCost" placeholder="포장비, 광고비 등" min="0">
                                            <span class="unit">원</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- 판매 및 시뮬레이션 카드 -->
                            <div class="premium-card">
                                <div class="card-header">
                                    <div class="icon-wrapper bg-orange"><i class='bx bx-store-alt'></i></div>
                                    <h3>판매 및 시뮬레이션</h3>
                                </div>
                                <div class="card-body">
                                    <div class="fg">
                                        <label>판매 배송비 <span class="hint">(기본: 부가세 포함)</span></label>
                                        <div class="input-wrapper">
                                            <input type="number" id="fldSaleShipping" placeholder="3000" min="0">
                                            <span class="unit">원</span>
                                        </div>
                                    </div>
                                    <label class="toggle-checkbox" style="margin-bottom: 20px;">
                                        <input type="checkbox" id="chkSaleVat" checked>
                                        <div class="toggle-switch"></div>
                                        <span>판매가/배송비에 부가세 10% 포함</span>
                                    </label>
                                    
                                    <div class="simulation-box">
                                        <div class="fg">
                                            <label class="flex-between">
                                                <span class="text-primary">목표 마진율 (%)</span>
                                                <span class="badge-calc bg-primary">역산</span>
                                            </label>
                                            <div class="input-wrapper">
                                                <input type="number" id="fldTargetMarginRate" placeholder="예: 30" min="0" step="0.1">
                                                <span class="unit">%</span>
                                            </div>
                                        </div>
                                        
                                        <div class="sync-icon"><i class='bx bx-transfer-alt'></i></div>
                                        
                                        <div class="fg">
                                            <label class="flex-between">
                                                <span class="text-orange">직접 판매가 입력</span>
                                                <span class="badge-calc bg-orange">정산</span>
                                            </label>
                                            <div class="input-wrapper">
                                                <input type="number" id="fldSalePrice" placeholder="0" min="0">
                                                <span class="unit">원</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 우측: 결과 패널 (Sticky) -->
                    <div class="result-panel">
                        <div class="sticky-wrapper">
                            <div class="premium-card result-card">
                                <h3>시뮬레이션 결과</h3>
                                
                                <div class="result-row primary-result">
                                    <span>최종 마진액</span>
                                    <strong id="resMarginAmount">0원</strong>
                                </div>
                                
                                <div class="result-row primary-result">
                                    <span>최종 마진율</span>
                                    <strong id="resMarginRate">0.0%</strong>
                                </div>
                                
                                <div class="divider"></div>
                                
                                <div class="result-row secondary-result">
                                    <span class="flex-align">스토어 수수료 <i class='bx bx-help-circle tooltip-icon' title="[수수료 산출]&#10;주문연동수수료 (3.63%): (판매가+배송비) × 3.63%&#10;판매수수료 (3.00%): 판매가 × 3.00%"></i></span>
                                    <strong id="resCommission" class="text-danger">0원</strong>
                                </div>
                                
                                <div class="result-row secondary-result">
                                    <span>총 매입 원가</span>
                                    <strong id="resTotalCost">0원</strong>
                                </div>
                                
                                <button id="btnSaveHistory" class="btn-primary-large">
                                    <i class='bx bx-save'></i> 목록에 추가
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 하단: 저장된 리스트 -->
                <div class="history-section premium-card">
                    <div class="card-header">
                        <h3>저장된 시뮬레이션 내역</h3>
                        <span class="text-sm text-gray">저장된 내역은 서버에 동기화됩니다.</span>
                    </div>
                    <div class="table-responsive">
                        <table class="modern-table">
                            <thead>
                                <tr>
                                    <th>상품명</th>
                                    <th>매입가</th>
                                    <th>매입 배송비</th>
                                    <th>판매가</th>
                                    <th>판매 배송비</th>
                                    <th>마진액</th>
                                    <th>마진율</th>
                                    <th>수수료</th>
                                    <th>관리</th>
                                </tr>
                            </thead>
                            <tbody id="historyTableBody">
                                <!-- JS로 렌더링 -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- 스낵바 알림 -->
    <div id="snackbar"></div>

    <script src="04_Seller K/margin_calculator/app.js"></script>
</body>
</html>
