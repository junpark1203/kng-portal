<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정산내역</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Boxicons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../../styles.css?v=3">
    <link rel="stylesheet" href="../../01_Logistics/logistics-theme.css?v=3">
    <style>
        .segmented-control .btn-check:checked + label { background-color: #0d6efd; color: #fff; border-color: #0d6efd; z-index: 2; }
        
        .direct-row { background-color: #fefce8 !important; }
        
        /* 화면 표시용 스타일 (프린트에서는 숨김) */
        .print-header { display: none; }
        
        @media print {
            @page { margin: 10mm; size: A4 portrait; }
            html, body { height: auto !important; min-height: auto !important; background: white !important; margin: 0 !important; padding: 0 !important; overflow: visible !important; }
            
            /* Remove padding from container to prevent margin interference */
            .container-fluid { padding: 0 !important; margin: 0 !important; }
            
            /* Make printableArea static so margins and pagination work natively */
            #printableArea { display: block !important; position: static !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
            .no-print { display: none !important; }
            
            /* 프린트 전용 헤더 표시 */
            .print-header { display: block !important; }
            
            /* 헤더 영역 */
            .header-container { display: flex; justify-content: space-between; margin-bottom: 5px; align-items: flex-end; width: 100%; }
            .header-left { flex: 1; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
            .title-box { padding-bottom: 5px; margin-bottom: 10px; }
            .title-box h1 { margin: 0; font-size: 26px; letter-spacing: 2px; font-weight: 800; white-space: nowrap; }
            .recipient-box { margin-bottom: 10px; }
            .recipient-name { font-size: 18px; font-weight: bold; }
            .date-info { font-size: 12px; color: #333; }

            /* 공급자 표 */
            .supplier-table { border-collapse: collapse; border: 2px solid #000; width: 380px; font-size: 10.5px; margin-left: auto; }
            .supplier-table th, .supplier-table td { border: 1px solid #000; padding: 3px 3px; text-align: center; height: 22px; white-space: nowrap; }
            .supplier-table th { background-color: #f9f9f9 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .vertical-th { width: 20px; writing-mode: vertical-lr; letter-spacing: 12px; padding-top: 12px !important; }
            .stamp-cell { position: relative; }
            .stamp { position: absolute; right: -5px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; opacity: 0.9; mix-blend-mode: multiply; }
            .address-cell { white-space: normal !important; text-align: left !important; padding-left: 6px !important; font-size: 9.5px; }

            /* 금액 표기 란 */
            .amount-box { border: 2px solid #000; padding: 6px 12px; margin-bottom: 5px; display: flex; justify-content: space-between; font-size: 13px; font-weight: bold; }

            /* 메인 데이터 표 인쇄 스타일 오버라이드 */
            .card { box-shadow: none !important; border: none !important; }
            .card-body { padding: 0 !important; }
            .table-responsive { box-shadow: none !important; overflow: visible !important; }
            
            .table { width: 100%; border-collapse: collapse !important; font-size: 9.5px; margin-bottom: 5px; border: 1px solid #000 !important; table-layout: fixed; }
            .table th, .table td { border: 1px solid #000 !important; padding: 2px 2px !important; text-align: center; height: 23px; line-height: 1.1 !important; white-space: nowrap; letter-spacing: -0.5px; }
            .table tr { border: none !important; }
            .table td.wrap-cell { white-space: normal !important; text-align: left !important; padding-left: 4px !important; letter-spacing: normal; }
            .table th { background-color: #f9f9f9 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; font-weight: bold; color: black; }
            
            .table tr.total-row td { border-top: 2px solid #000 !important; border-bottom: 1px solid #000 !important; background-color: #f9f9f9 !important; font-weight: bold; font-size: 11px; padding: 4px 3px !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .table tr.empty-marker td { text-align: center; letter-spacing: 2px; color: #555; }
        }
    </style>
</head>
<body class="bg-light">

<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 no-print">
        <h4 class="mb-0 fw-bold"><i class='bx bx-book-bookmark text-primary'></i> 정산장부</h4>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary shadow-sm fw-bold bg-white" onclick="app.printLedger()">
                <i class='bx bx-printer'></i> 인쇄
            </button>
        </div>
    </div>

    <!-- 리스트 뷰 및 필터 영역 -->
    <div class="card shadow-sm border-0 mb-4 no-print">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center">
                <div class="d-flex gap-2 align-items-center" style="overflow-x: auto; padding-bottom: 5px;">
                    <div class="segmented-control flex-shrink-0" id="datePresets">
                        <input type="radio" class="btn-check" name="datePreset" id="presetPrevMonth" value="전월" checked>
                        <label class="text-nowrap" for="presetPrevMonth">전월</label>
                        
                        <input type="radio" class="btn-check" name="datePreset" id="presetMonth" value="당월">
                        <label class="text-nowrap" for="presetMonth">당월</label>
                        
                        <input type="radio" class="btn-check" name="datePreset" id="preset3M" value="3개월">
                        <label class="text-nowrap" for="preset3M">3개월</label>
                        
                        <input type="radio" class="btn-check" name="datePreset" id="preset6M" value="6개월">
                        <label class="text-nowrap" for="preset6M">6개월</label>
                        
                        <input type="radio" class="btn-check" name="datePreset" id="presetAll" value="전체">
                        <label class="text-nowrap" for="presetAll">전체</label>
                    </div>
                    
                    <div class="segmented-control flex-shrink-0 ms-2" id="ledgerTypeFilters">
                        <input type="radio" class="btn-check" name="ledgerType" id="typeIn" value="입고" onchange="app.loadLedger()">
                        <label class="text-nowrap" for="typeIn">매입장부</label>
                        
                        <input type="radio" class="btn-check" name="ledgerType" id="typeOut" value="출고" onchange="app.loadLedger()">
                        <label class="text-nowrap" for="typeOut">매출장부</label>
                        
                        <input type="radio" class="btn-check" name="ledgerType" id="typeAll" value="전체" checked onchange="app.loadLedger()">
                        <label class="text-nowrap" for="typeAll">전체</label>
                    </div>
                    
                    <input type="date" class="form-control form-control-sm" id="startDate" title="시작일">
                    <span class="text-muted flex-shrink-0">~</span>
                    <input type="date" class="form-control form-control-sm" id="endDate" title="종료일">
                    
                    <div class="input-group input-group-sm flex-shrink-0" style="width: 200px;">
                        <input type="text" id="partnerInput" class="form-control" placeholder="거래처 검색 (Enter)" autocomplete="off" onkeypress="if(event.key==='Enter'){event.preventDefault(); app.openPartnerSearchModal('partnerInput');}">
                        <button class="btn btn-outline-secondary" type="button" onclick="app.openPartnerSearchModal('partnerInput')" title="거래처 검색"><i class='bx bx-search'></i></button>
                    </div>
                    
                    <div class="form-check form-switch ms-2 me-2 flex-shrink-0 d-flex align-items-center">
                        <input class="form-check-input mt-0 me-2" type="checkbox" role="switch" id="aggregateByBizNum">
                        <label class="form-check-label mb-0 text-nowrap" for="aggregateByBizNum" style="font-size: 0.85rem; padding-top: 2px;">동일 사업자 합산</label>
                    </div>

                    <button class="btn btn-sm btn-primary text-nowrap flex-shrink-0" type="button" onclick="app.loadLedger()"><i class='bx bx-search'></i> 조회</button>
                </div>
            </div>
        </div>
    </div>

    <div id="printableArea">
        <!-- 인쇄 시에만 보이는 전용 헤더 -->
        <div class="print-header mb-4">
            <div class="header-container">
                <div class="header-left">
                    <div class="title-box">
                        <h1 id="printTitle">거래(공급)내역서</h1>
                    </div>
                    <div class="recipient-box">
                        <span class="recipient-name" id="printPartnerName"></span> 貴中
                    </div>
                    <div class="date-info" id="printPeriod">
                        거래기간 : 2026-08-01 ~ 2026-08-31
                    </div>
                </div>
                
                <div class="header-right">
                    <table class="supplier-table">
                        <tr>
                            <th rowspan="4" class="vertical-th">공급자</th>
                            <th style="width: 55px;">등록번호</th>
                            <td colspan="3" id="printBizNo"></td>
                        </tr>
                        <tr>
                            <th>상 호</th>
                            <td style="width: 110px;" id="printBizName"></td>
                            <th style="width: 45px;">대표자</th>
                            <td class="stamp-cell" style="width: 70px;"><span id="printCeo"></span> <img src="../../assets/images/stamp.png" class="stamp" alt="직인" onerror="this.style.display='none'"></td>
                        </tr>
                        <tr>
                            <th>주 소</th>
                            <td colspan="3" class="address-cell" id="printAddress"></td>
                        </tr>
                        <tr>
                            <th>업 태</th>
                            <td><span id="printBizType"></span></td>
                            <th>종 목</th>
                            <td><span id="printBizItem"></span></td>
                        </tr>
                    </table>
                </div>
            </div>

            <!-- 금액란 -->
            <div class="amount-box">
                <span id="printAmountKor">합 계 금 액 : </span>
                <span id="printAmountNum"></span>
            </div>
        </div>
        
        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-sm align-middle mb-0" style="font-size: 0.85rem;">
                        <thead class="table-light sticky-top text-nowrap" style="z-index: 10;">
                            <tr>
                                <th class="text-center text-nowrap" style="width: 7%;">일자</th>
                                <th style="width: 25%;">품목명</th>
                                <th style="width: 12%;">규격</th>
                                <th class="text-end" style="width: 7%;">수량</th>
                                <th class="text-center" style="width: 7%;">단위</th>
                                <th class="text-end" style="width: 9%;">단가</th>
                                <th class="text-end" style="width: 11%;">공급가액</th>
                                <th class="text-end" style="width: 10%;">부가세</th>
                                <th style="width: 12%;">비고</th>
                            </tr>
                        </thead>
                        <tbody id="ledgerTableBody">
                            <tr><td colspan="9" class="text-center py-5 text-muted">조회할 거래처를 선택해주세요.</td></tr>
                        </tbody>
                        <!-- tfoot은 이제 더이상 쓰지 않고 tbody 마지막에 tr로 주입할 예정이지만, 화면 표시나 안전성을 위해 숨겨둠 -->
                        <tfoot id="ledgerTableFoot" style="display: none;">
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 거래처 검색 모달 -->
<div class="modal fade" id="partnerSearchModal" tabindex="-1" style="z-index: 1100;">
    <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header bg-secondary text-white py-2">
                <h6 class="modal-title fw-bold mb-0"><i class='bx bx-search'></i> 거래처 검색</h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body bg-light">
                <input type="hidden" id="partnerSearchTargetInput">
                <div class="input-group mb-3 shadow-sm">
                    <span class="input-group-text bg-white"><i class='bx bx-search'></i></span>
                    <input type="text" id="partnerSearchInput" class="form-control" placeholder="거래처명 또는 키워드 입력..." onkeyup="app.filterPartnerSearch()">
                </div>
                <div class="list-group shadow-sm" id="partnerSearchList">
                    <!-- JS Render -->
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script type="module">
    import { authFetch } from '../../js/auth.js';
    window.authFetch = authFetch;
</script>
<script src="app.js"></script>

</body>
</html>
