<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정산내역</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Boxicons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../../styles.css?v=3">
    <link rel="stylesheet" href="../../01_Logistics/logistics-theme.css?v=3">
    <style>
        /* 상단 활성 버튼 강조 스타일 */
        #datePresetGroup .btn.active,
        #datePresetGroup .btn.btn-primary,
        .erp-preset-btn.active {
            background-color: #2563eb !important;
            border-color: #2563eb !important;
            color: #ffffff !important;
            font-weight: 700 !important;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.25) !important;
            z-index: 2;
        }

        #ledgerTypeFilters .btn-check:checked + label {
            background-color: #2563eb !important;
            border-color: #2563eb !important;
            color: #ffffff !important;
            font-weight: 700 !important;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.25) !important;
            z-index: 2;
        }
        #ledgerTypeFilters #typeOut:checked + label {
            background-color: #dc2626 !important;
            border-color: #dc2626 !important;
            color: #ffffff !important;
            box-shadow: 0 2px 4px rgba(220, 38, 38, 0.25) !important;
        }
        
        .direct-row { background-color: #fefce8 !important; }
        
        /* 화면 표시용 스타일 (프린트에서는 숨김) */
        .print-header { display: none; }
        
        @media print {
            @page {
                size: A4 portrait;
                margin: 12mm 10mm 15mm 10mm; /* 상 12mm, 우 10mm, 하 15mm(하단 잘림 완벽 방지), 좌 10mm */
            }
            html, body {
                height: auto !important;
                min-height: auto !important;
                background: white !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: visible !important;
            }
            
            /* 부모 컨테이너 여백 제거 */
            .container-fluid { padding: 0 !important; margin: 0 !important; }
            
            /* printableArea는 @page margin이 있으므로 padding 0 */
            #printableArea {
                display: block !important;
                position: static !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                box-sizing: border-box !important;
            }
            .no-print, .d-print-none { display: none !important; }
            
            /* 프린트 전용 헤더 표시 */
            .print-header { display: block !important; }
            
            /* 헤더 영역 */
            .header-container { display: flex; justify-content: space-between; margin-bottom: 5px; align-items: flex-end; width: 100%; }
            .header-left { flex: 1; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
            .title-box { padding-bottom: 5px; margin-bottom: 10px; }
            .title-box h1 { margin: 0; font-size: 26px; letter-spacing: 2px; font-weight: 800; white-space: nowrap; }
            .recipient-box { margin-bottom: 10px; }
            .recipient-name { font-size: 18px; font-weight: bold; }
            .date-info { font-size: 12px; color: #333; }

            /* 공급자 표 */
            .supplier-table { border-collapse: collapse; border: 2px solid black; width: 380px; font-size: 11px; margin-left: auto; }
            .supplier-table th, .supplier-table td { border: 1px solid black; padding: 4px 4px; text-align: center; height: 24px; white-space: nowrap; }
            .supplier-table th { background-color: #f9f9f9 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .vertical-th { width: 20px; writing-mode: vertical-lr; letter-spacing: 12px; padding-top: 12px !important; }
            .stamp-cell { position: relative; }
            .stamp { position: absolute; right: -5px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; opacity: 0.9; mix-blend-mode: multiply; }
            .address-cell { white-space: normal !important; text-align: left !important; padding-left: 6px !important; }

            /* 금액 표기 란 */
            .amount-box { border: 2px solid black; padding: 6px 12px; margin-bottom: 10px; display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; }

            /* ── 메인 데이터 표: 목업과 동일한 스타일 ── */
            #printableArea .card, #printableArea .card-body, #printableArea .table-responsive, #printableArea .table { border-radius: 0 !important; }
            #printableArea .card { box-shadow: none !important; border: none !important; }
            #printableArea .card-body { padding: 0 !important; }
            #printableArea .table-responsive { box-shadow: none !important; overflow: visible !important; }
            #printableArea thead.sticky-top, #printableArea thead { position: static !important; }
            
            #printableArea .table, #printableArea .table *, #printableArea .table > :not(caption) > * > * {
                box-shadow: none !important;
                border: none !important;
                --bs-table-bg: transparent !important;
                --bs-table-accent-bg: transparent !important;
                --bs-table-striped-bg: transparent !important;
                --bs-table-hover-bg: transparent !important;
                --bs-table-border-color: transparent !important;
            }
            #printableArea .table thead, #printableArea .table tbody, #printableArea .table tfoot, #printableArea .table tr { border: none !important; }
            
            /* 테이블 본체 */
            #printableArea .table {
                width: 100% !important;
                border-collapse: collapse !important;
                font-size: 11px !important;
                margin-bottom: 5px !important;
                table-layout: fixed !important;
                border-top: 2px solid #000 !important;
                border-bottom: 2px solid #000 !important;
                border-left: none !important;
                border-right: none !important;
                page-break-inside: auto !important;
            }
            
            /* 테이블 헤더 및 행 분할 제어 */
            #printableArea .table thead {
                display: table-header-group !important;
            }
            #printableArea .table tbody tr {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }
            
            /* 셀 기본 스타일 */
            #printableArea .table tbody td,
            #printableArea .table td {
                border-left: none !important;
                border-top: none !important;
                border-right: 1px solid #ccc !important;
                border-bottom: 1px solid #aaa !important;
                padding: 2px 2px !important;
                text-align: center !important;
                vertical-align: middle !important;
                height: 24px !important;
                line-height: 1.15 !important;
                white-space: nowrap !important;
                font-size: 11px !important;
                color: #000 !important;
                background-color: transparent !important;
                box-shadow: none !important;
                overflow: hidden !important;
            }
            #printableArea .table tbody tr td:last-child,
            #printableArea .table td:last-child {
                border-right: none !important;
            }
            
            /* 헤더 */
            #printableArea .table thead th,
            #printableArea .table th {
                border-left: none !important;
                border-top: none !important;
                border-bottom: 1.5px solid #000 !important;
                border-right: 1px solid #ccc !important;
                background-color: #f9f9f9 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                font-weight: bold !important;
                color: black !important;
                text-align: center !important;
                vertical-align: middle !important;
                font-size: 11px !important;
                padding: 2px 2px !important;
                height: 24px !important;
            }
            #printableArea .table thead tr th:last-child,
            #printableArea .table th:last-child {
                border-right: none !important;
            }
            
            /* 데이터 정렬 및 규격 줄바꿈 지원 */
            #printableArea .table td { font-weight: normal !important; }
            #printableArea .table td.text-end { text-align: right !important; vertical-align: middle !important; letter-spacing: -0.5px !important; padding-right: 4px !important; }
            #printableArea .table td.text-start,
            #printableArea .table td.wrap-cell,
            #printableArea .table td.spec-cell {
                text-align: left !important;
                vertical-align: middle !important;
                padding-left: 3px !important;
                padding-right: 3px !important;
                white-space: normal !important;
                word-break: break-all !important;
                overflow-wrap: anywhere !important;
                line-height: 1.15 !important;
            }
            #printableArea .table td.spec-cell {
                text-align: center !important;
                font-size: 10px !important;
                letter-spacing: -0.3px !important;
            }
            #printableArea .table td.text-center { text-align: center !important; vertical-align: middle !important; letter-spacing: -0.3px !important; }
            
            /* 합계행 */
            #printableArea .table tbody tr.total-row td,
            #printableArea .table tr.total-row td {
                border-top: 2px solid #000 !important;
                border-bottom: none !important;
                border-right: 1px solid #ccc !important;
                background-color: #f9f9f9 !important;
                font-weight: bold !important;
                font-size: 11px !important;
                padding: 4px 3px !important;
                vertical-align: middle !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }
            #printableArea .table tbody tr.total-row td:last-child,
            #printableArea .table tr.total-row td:last-child {
                border-right: none !important;
            }
            #printableArea .table tr.empty-marker td {
                text-align: center !important;
                vertical-align: middle !important;
                letter-spacing: 2px;
                color: #555 !important;
                border-bottom: 1px solid #aaa !important;
            }
        }
    </style>
</head>
<body class="bg-light">

<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 no-print">
        <h4 class="mb-0 fw-bold"><i class='bx bx-book-bookmark text-primary'></i> 정산장부</h4>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary shadow-sm fw-bold bg-white" onclick="app.printLedger()">
                <i class='bx bx-printer'></i> 인쇄
            </button>
        </div>
    </div>

    <!-- 리스트 뷰 및 필터 영역 -->
    <div class="card shadow-sm border-0 mb-3 no-print">
        <div class="card-body p-3">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                <!-- 좌측: 날짜 프리셋 및 날짜 선택 -->
                <div class="d-flex gap-2 align-items-center flex-wrap">
                    <div class="btn-group btn-group-sm" role="group" id="datePresetGroup">
                        <button type="button" class="btn btn-primary text-white fw-bold text-nowrap" id="btnPreset_prevMonth" onclick="app.setDatePreset('prevMonth')">전월</button>
                        <button type="button" class="btn btn-outline-secondary text-nowrap" id="btnPreset_thisMonth" onclick="app.setDatePreset('thisMonth')">당월</button>
                        <button type="button" class="btn btn-outline-secondary text-nowrap" id="btnPreset_prevYear" onclick="app.setDatePreset('prevYear')">전년도</button>
                        <button type="button" class="btn btn-outline-secondary text-nowrap" id="btnPreset_thisYear" onclick="app.setDatePreset('thisYear')">금년도</button>
                        <button type="button" class="btn btn-outline-secondary text-nowrap" id="btnPreset_all" onclick="app.setDatePreset('all')">전체</button>
                    </div>

                    <input type="date" class="form-control form-control-sm" id="startDate" style="width: 130px; min-width: 120px;" onchange="app.onDateInputChange()">
                    <span class="text-muted">~</span>
                    <input type="date" class="form-control form-control-sm" id="endDate" style="width: 130px; min-width: 120px;" onchange="app.onDateInputChange()">

                    <div class="btn-group btn-group-sm ms-1" role="group" id="ledgerTypeFilters">
                        <input type="radio" class="btn-check" name="ledgerType" id="typeAll" value="전체" checked onchange="app.loadLedger()">
                        <label class="btn btn-outline-secondary text-nowrap" for="typeAll">전체</label>

                        <input type="radio" class="btn-check" name="ledgerType" id="typeIn" value="입고" onchange="app.loadLedger()">
                        <label class="btn btn-outline-secondary text-nowrap" for="typeIn">매입장부</label>
                        
                        <input type="radio" class="btn-check" name="ledgerType" id="typeOut" value="출고" onchange="app.loadLedger()">
                        <label class="btn btn-outline-secondary text-nowrap" for="typeOut">매출장부</label>
                    </div>

                    <!-- 자재계정 필터 -->
                    <select class="form-select form-select-sm" id="accountFilter" style="width: 140px; min-width: 130px; flex-shrink: 0;" onchange="app.loadLedger()">
                        <option value="">전체 자재계정</option>
                        <optgroup label="안전자재">
                            <option value="안전자재">안전자재 전체</option>
                            <option value="안전자재-일반">　└ 안전(일반)</option>
                            <option value="안전자재-환경">　└ 안전(환경)</option>
                        </optgroup>
                        <option value="잡자재">잡자재</option>
                        <option value="기타자재">기타자재</option>
                        <option value="쇼핑몰">쇼핑몰</option>
                        <option value="미분류">미분류</option>
                    </select>
                </div>

                <!-- 우측: 거래처 검색, 사업자 합산 스위치, 조회 버튼 -->
                <div class="d-flex gap-2 align-items-center flex-wrap">
                    <div class="input-group input-group-sm flex-shrink-0" style="width: 220px;">
                        <input type="text" id="partnerInput" class="form-control" placeholder="거래처 검색 (Enter)" autocomplete="off" onkeypress="if(event.key==='Enter'){event.preventDefault(); app.openPartnerSearchModal('partnerInput');}">
                        <button class="btn btn-outline-secondary" type="button" onclick="app.openPartnerSearchModal('partnerInput')" title="거래처 검색"><i class='bx bx-search'></i></button>
                    </div>
                    
                    <div class="form-check form-switch ms-1 me-1 flex-shrink-0 d-flex align-items-center">
                        <input class="form-check-input mt-0 me-1" type="checkbox" role="switch" id="aggregateByBizNum" onchange="app.loadLedger()">
                        <label class="form-check-label mb-0 text-nowrap small text-secondary" for="aggregateByBizNum">사업자 합산</label>
                    </div>

                    <button class="btn btn-sm btn-primary text-nowrap flex-shrink-0" type="button" onclick="app.loadLedger()"><i class='bx bx-search'></i> 조회</button>
                </div>
            </div>

            <!-- 하단 바: 장부 내 실시간 인라인 검색 -->
            <div class="d-flex justify-content-between align-items-center mt-2 pt-2 border-top flex-wrap gap-2 d-none" id="ledgerInlineSearchContainer">
                <div class="d-flex align-items-center gap-2">
                    <span class="small text-muted"><i class='bx bx-filter'></i> 장부 내 빠른 검색:</span>
                    <div class="position-relative" style="width: 220px;">
                        <input type="text" id="ledgerFilterInput" class="form-control form-control-sm pe-4" placeholder="품목명, 규격, 자재계정, 비고 필터..." onkeyup="app.filterLedgerRows()">
                        <button type="button" class="btn btn-link btn-sm text-muted position-absolute end-0 top-50 translate-middle-y text-decoration-none p-0 pe-2 d-none" id="clearLedgerFilterBtn" onclick="app.clearLedgerFilter()">
                            <i class='bx bx-x-circle'></i>
                        </button>
                    </div>
                </div>
                <div id="ledgerPartnerInfo" class="small text-muted"></div>
            </div>
        </div>
    </div>

    <!-- 정산장부 실거래 요약 스트립 -->
    <div id="ledgerSummaryStrip" class="mb-3 p-2 px-3 bg-white rounded border shadow-sm d-none flex-column gap-2 no-print" style="font-size: 0.83rem;">
        <!-- JS Render -->
    </div>

    <div id="printableArea">
        <!-- 인쇄 시에만 보이는 전용 헤더 -->
        <div class="print-header mb-4">
            <div class="header-container">
                <div class="header-left">
                    <div class="title-box">
                        <h1 id="printTitle">거래(공급)내역서</h1>
                    </div>
                    <div class="recipient-box">
                        <span class="recipient-name" id="printPartnerName"></span> 貴中
                    </div>
                    <div class="date-info" id="printPeriod">
                        거래기간 : 2026-08-01 ~ 2026-08-31
                    </div>
                </div>
                
                <div class="header-right">
                    <table class="supplier-table">
                        <tr>
                            <th rowspan="4" class="vertical-th">공급자</th>
                            <th style="width: 55px;">등록번호</th>
                            <td colspan="3" id="printBizNo"></td>
                        </tr>
                        <tr>
                            <th>상 호</th>
                            <td style="width: 110px;" id="printBizName"></td>
                            <th style="width: 45px;">대표자</th>
                            <td class="stamp-cell" style="width: 70px;"><span id="printCeo"></span> <img src="../../assets/images/stamp.png" class="stamp" alt="직인" onerror="this.style.display='none'"></td>
                        </tr>
                        <tr>
                            <th>주 소</th>
                            <td colspan="3" class="address-cell" id="printAddress"></td>
                        </tr>
                        <tr>
                            <th>업 태</th>
                            <td><span id="printBizType"></span></td>
                            <th>종 목</th>
                            <td><span id="printBizItem"></span></td>
                        </tr>
                    </table>
                </div>
            </div>

            <!-- 금액란 -->
            <div class="amount-box">
                <span id="printAmountKor">합 계 금 액 : </span>
                <span id="printAmountNum"></span>
            </div>
        </div>
        
        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-sm align-middle mb-0" style="font-size: 0.85rem;">
                        <thead class="table-light sticky-top text-nowrap" style="z-index: 10;">
                            <tr>
                                <th class="text-center" style="width: 7%;">일자</th>
                                <th class="text-center" style="width: 7%;">자재계정</th>
                                <th class="text-center" style="width: 20%;">품목명</th>
                                <th class="text-center" style="width: 15%;">규격</th>
                                <th class="text-center" style="width: 5%;">수량</th>
                                <th class="text-center" style="width: 4%;">단위</th>
                                <th class="text-center" style="width: 9%;">단가</th>
                                <th class="text-center" style="width: 11%;">공급가액</th>
                                <th class="text-center" style="width: 10%;">부가세</th>
                                <th class="text-center" style="width: 12%;">비고</th>
                            </tr>
                        </thead>
                        <tbody id="ledgerTableBody">
                            <tr><td colspan="10" class="text-center py-5 text-muted">조회할 거래처를 선택해주세요.</td></tr>
                        </tbody>
                        <!-- tfoot은 이제 더이상 쓰지 않고 tbody 마지막에 tr로 주입할 예정이지만, 화면 표시나 안전성을 위해 숨겨둠 -->
                        <tfoot id="ledgerTableFoot" style="display: none;">
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 거래처 검색 모달 -->
<div class="modal fade" id="partnerSearchModal" tabindex="-1" style="z-index: 1100;">
    <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header bg-secondary text-white py-2">
                <h6 class="modal-title fw-bold mb-0"><i class='bx bx-search'></i> 거래처 검색</h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body bg-light">
                <input type="hidden" id="partnerSearchTargetInput">
                <div class="input-group mb-3 shadow-sm">
                    <span class="input-group-text bg-white"><i class='bx bx-search'></i></span>
                    <input type="text" id="partnerSearchInput" class="form-control" placeholder="거래처명 또는 키워드 입력..." onkeyup="app.filterPartnerSearch()">
                </div>
                <div class="list-group shadow-sm" id="partnerSearchList">
                    <!-- JS Render -->
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script type="module">
    import { authFetch } from '../../js/auth.js';
    window.authFetch = authFetch;
</script>
<script src="app.js"></script>

</body>
</html>
