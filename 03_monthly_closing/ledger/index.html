<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정산내역</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Boxicons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../../styles.css?v=3">
    <link rel="stylesheet" href="../../01_Logistics/logistics-theme.css?v=3">
    <style>
        .segmented-control .btn-check:checked + label { background-color: #0d6efd; color: #fff; border-color: #0d6efd; z-index: 2; }
        
        .direct-row { background-color: #fefce8 !important; }
        
        /* 화면 공통 및 출력용 하이브리드 헤더 스타일 */
        .hybrid-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 25px; }
        .header-left { flex: 1; padding-bottom: 5px; text-align: center; }
        .print-title { font-size: 34px; font-weight: 700; color: #212529; margin: 0 0 25px 0; letter-spacing: 12px; text-decoration: underline; text-underline-offset: 8px; padding-left: 12px; }
        .date-text { font-size: 15px; color: #495057; margin-bottom: 25px; text-align: center; }
        .recipient-text { font-size: 18px; text-align: left; margin-left: 20px; font-weight: 700; }
        .header-right { width: 420px; }
        .supplier-table { width: 100%; border-collapse: collapse; font-size: 13px; border: 2px solid #212529; }
        .supplier-table th, .supplier-table td { border: 1px solid #dee2e6; padding: 6px 8px; }
        .supplier-table th { background-color: #f8f9fa; color: #495057; text-align: center; font-weight: 600; }
        .supplier-table td { color: #212529; }
        .supplier-th { width: 30px; writing-mode: vertical-rl; text-orientation: upright; letter-spacing: 5px; padding: 10px 5px !important; }
        .stamp-cell { position: relative; }
        .stamp { position: absolute; top: 50%; right: 5px; transform: translateY(-50%); width: 45px; height: 45px; opacity: 0.85; mix-blend-mode: multiply; }
        
        @media print {
            @page { margin: 15mm; size: A4; }
            body { padding: 0; margin: 0; }
            body * { visibility: hidden; }
            #printableArea, #printableArea * { visibility: visible; }
            #printableArea { position: static; width: 100%; margin: 0; padding: 0; }
            .no-print { display: none !important; }
            /* 인쇄 시 여백 및 스타일 최소화 */
            .card { box-shadow: none !important; border: none !important; }
            .card-body { padding: 0 !important; }
            .table-responsive { box-shadow: none !important; overflow: visible !important; }
            
            /* 인쇄 시 색상 보장 */
            .supplier-table th { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body class="bg-light">

<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 no-print">
        <h4 class="mb-0 fw-bold"><i class='bx bx-book-bookmark text-primary'></i> 정산장부</h4>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary shadow-sm fw-bold bg-white" onclick="app.printLedger()">
                <i class='bx bx-printer'></i> 인쇄
            </button>
        </div>
    </div>

    <!-- 리스트 뷰 및 필터 영역 -->
    <div class="card shadow-sm border-0 mb-4 no-print">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center">
                <div class="d-flex gap-2 align-items-center" style="overflow-x: auto; padding-bottom: 5px;">
                    <div class="segmented-control flex-shrink-0" id="datePresets">
                        <input type="radio" class="btn-check" name="datePreset" id="presetPrevMonth" value="전월" checked>
                        <label class="text-nowrap" for="presetPrevMonth">전월</label>
                        
                        <input type="radio" class="btn-check" name="datePreset" id="presetMonth" value="당월">
                        <label class="text-nowrap" for="presetMonth">당월</label>
                        
                        <input type="radio" class="btn-check" name="datePreset" id="preset3M" value="3개월">
                        <label class="text-nowrap" for="preset3M">3개월</label>
                        
                        <input type="radio" class="btn-check" name="datePreset" id="preset6M" value="6개월">
                        <label class="text-nowrap" for="preset6M">6개월</label>
                        
                        <input type="radio" class="btn-check" name="datePreset" id="presetAll" value="전체">
                        <label class="text-nowrap" for="presetAll">전체</label>
                    </div>
                    
                    <div class="segmented-control flex-shrink-0 ms-2" id="ledgerTypeFilters">
                        <input type="radio" class="btn-check" name="ledgerType" id="typeIn" value="입고" onchange="app.loadLedger()">
                        <label class="text-nowrap" for="typeIn">매입장부</label>
                        
                        <input type="radio" class="btn-check" name="ledgerType" id="typeOut" value="출고" onchange="app.loadLedger()">
                        <label class="text-nowrap" for="typeOut">매출장부</label>
                        
                        <input type="radio" class="btn-check" name="ledgerType" id="typeAll" value="전체" checked onchange="app.loadLedger()">
                        <label class="text-nowrap" for="typeAll">전체</label>
                    </div>
                    
                    <input type="date" class="form-control form-control-sm" id="startDate" title="시작일">
                    <span class="text-muted flex-shrink-0">~</span>
                    <input type="date" class="form-control form-control-sm" id="endDate" title="종료일">
                    
                    <div class="input-group input-group-sm flex-shrink-0" style="width: 200px;">
                        <input type="text" id="partnerInput" class="form-control" placeholder="거래처 검색 (Enter)" autocomplete="off" onkeypress="if(event.key==='Enter'){event.preventDefault(); app.openPartnerSearchModal('partnerInput');}">
                        <button class="btn btn-outline-secondary" type="button" onclick="app.openPartnerSearchModal('partnerInput')" title="거래처 검색"><i class='bx bx-search'></i></button>
                    </div>
                    
                    <div class="form-check form-switch ms-2 me-2 flex-shrink-0 d-flex align-items-center">
                        <input class="form-check-input mt-0 me-2" type="checkbox" role="switch" id="aggregateByBizNum">
                        <label class="form-check-label mb-0 text-nowrap" for="aggregateByBizNum" style="font-size: 0.85rem; padding-top: 2px;">동일 사업자 합산</label>
                    </div>

                    <button class="btn btn-sm btn-primary text-nowrap flex-shrink-0" type="button" onclick="app.loadLedger()"><i class='bx bx-search'></i> 조회</button>
                </div>
            </div>
        </div>
    </div>

    <div id="printableArea">
        <div class="d-none d-print-block mb-4">
            <div class="hybrid-header">
                <div class="header-left">
                    <h2 class="print-title" id="printTitle">거 래 내 역 서</h2>
                    <div class="date-text" id="printPeriod"></div>
                    <div class="recipient-text"><span id="printPartnerName"></span> 귀하</div>
                </div>
                <div class="header-right">
                    <table class="supplier-table">
                        <tr>
                            <th rowspan="4" class="supplier-th">공급자</th>
                            <th style="width: 25%">등록번호</th>
                            <td colspan="3" id="printBizNo"></td>
                        </tr>
                        <tr>
                            <th>상호</th>
                            <td style="width: 35%" id="printBizName"></td>
                            <th style="width: 15%">대표자</th>
                            <td class="stamp-cell"><span id="printCeo"></span> <img src="../../assets/images/stamp.png" class="stamp" alt="직인" onerror="this.style.display='none'"></td>
                        </tr>
                        <tr>
                            <th>주소</th>
                            <td colspan="3" id="printAddress"></td>
                        </tr>
                        <tr>
                            <th>업태</th>
                            <td><span id="printBizType"></span></td>
                            <th>종목</th>
                            <td><span id="printBizItem"></span></td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>
        
        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-sm align-middle mb-0" style="font-size: 0.85rem;">
                        <thead class="table-light sticky-top text-nowrap" style="z-index: 10;">
                            <tr>
                                <th class="d-print-none" style="width: 130px;">고유번호</th>
                                <th class="text-center text-nowrap" style="width: 90px;">일자</th>
                                <th>품목명</th>
                                <th style="width: 120px;">규격</th>
                                <th class="text-center" style="width: 60px;">단위</th>
                                <th class="text-end" style="width: 80px;">수량</th>
                                <th class="text-end" style="width: 90px;">단가</th>
                                <th class="text-end" style="width: 100px;">공급가액</th>
                                <th class="text-end" style="width: 100px;">부가세</th>
                                <th class="text-end" style="width: 100px;">합계</th>
                                <th style="width: 150px;">비고</th>
                            </tr>
                        </thead>
                        <tbody id="ledgerTableBody">
                            <tr><td colspan="11" class="text-center py-5 text-muted">조회할 거래처를 선택해주세요.</td></tr>
                        </tbody>
                        <tfoot id="ledgerTableFoot" class="table-secondary fw-bold" style="display: none;">
                            <tr>
                                <td colspan="7" class="text-end">합계</td>
                                <td class="text-end text-primary" id="sumTotal">0</td>
                                <td class="text-end text-primary" id="sumVat">0</td>
                                <td class="text-end text-primary" id="sumGrand">0</td>
                                <td></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 거래처 검색 모달 -->
<div class="modal fade" id="partnerSearchModal" tabindex="-1" style="z-index: 1100;">
    <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header bg-secondary text-white py-2">
                <h6 class="modal-title fw-bold mb-0"><i class='bx bx-search'></i> 거래처 검색</h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body bg-light">
                <input type="hidden" id="partnerSearchTargetInput">
                <div class="input-group mb-3 shadow-sm">
                    <span class="input-group-text bg-white"><i class='bx bx-search'></i></span>
                    <input type="text" id="partnerSearchInput" class="form-control" placeholder="거래처명 또는 키워드 입력..." onkeyup="app.filterPartnerSearch()">
                </div>
                <div class="list-group shadow-sm" id="partnerSearchList">
                    <!-- JS Render -->
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script type="module">
    import { authFetch } from '../../js/auth.js';
    window.authFetch = authFetch;
</script>
<script src="app.js"></script>

</body>
</html>
