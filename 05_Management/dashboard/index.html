<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대시보드</title>
    <meta name="description" content="K&G 대시보드 - 증시, 환율, 일정, 결재, 재고 현황을 한눈에 확인합니다.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header" id="dashboardHeader">
            <h1><i class='bx bx-grid-alt'></i> 대시보드</h1>
            <div class="header-actions">
                <span class="header-timestamp" id="headerTimestamp"></span>
                <button id="refreshBtn" class="refresh-btn" title="새로고침"><i class='bx bx-refresh'></i></button>
            </div>
        </header>

        <!-- 섹션 1: 주요 증시 (TradingView Tickers) -->
        <div class="market-bar">
            <div class="market-stocks">
                <div class="market-label"><i class='bx bx-line-chart'></i> 주요 증시</div>
                <div class="custom-market-widget" id="customMarketWidget">
                    <div class="market-loading">데이터를 불러오는 중...</div>
                </div>
            </div>
        </div>

        <div class="dashboard-grid">
            <!-- 섹션 2: 날씨 + 환율 -->
            <section class="widget widget-weather" id="weatherSection">
                <h2>
                    <div class="widget-title"><i class='bx bx-sun'></i> 날씨 <span class="widget-subtitle">서울</span></div>
                </h2>
                <div class="widget-content" id="weatherWidget">
                    <div class="skeleton-loader">
                        <div class="skeleton-item" style="height: 80px;"></div>
                        <div class="skeleton-item" style="height: 48px; margin-top: 12px;"></div>
                    </div>
                </div>
            </section>

            <section class="widget widget-exchange" id="exchangeSection">
                <h2>
                    <div class="widget-title"><i class='bx bx-dollar-circle'></i> 환율</div>
                </h2>
                <div class="widget-content" style="display: flex; flex-direction: column; justify-content: space-between; height: 100%;">
                    <div class="exchange-grid" id="exchangeGrid">
                        <div class="exchange-item skeleton-fx"><span class="fx-label">USD</span><span class="fx-rate"></span></div>
                        <div class="exchange-item skeleton-fx"><span class="fx-label">EUR</span><span class="fx-rate"></span></div>
                        <div class="exchange-item skeleton-fx"><span class="fx-label">JPY</span><span class="fx-rate"></span></div>
                        <div class="exchange-item skeleton-fx"><span class="fx-label">CNY</span><span class="fx-rate"></span></div>
                    </div>
                    
                    <div style="height: 1px; background: var(--border-light); margin: 16px 0;"></div>
                    
                    <div id="dateStripContainer">
                        <!-- Dates will be rendered here via JS -->
                    </div>
                </div>
            </section>
            <!-- 섹션: 즐겨찾기 -->
            <section class="widget widget-bookmarks" id="bookmarksSection">
                <h2>
                    <div class="widget-title"><i class='bx bx-star'></i> 즐겨찾기</div>
                </h2>
                <div class="widget-content">
                    <div class="bookmarks-grid" id="bookmarksGrid">
                        <!-- JS에서 렌더링 (최대 10개) -->
                    </div>
                </div>
            </section>

            <!-- 섹션 3: 이번달 일정 + 결재대기함 -->
            <section class="widget widget-calendar" id="calendarSection">
                <h2>
                    <div class="widget-title"><i class='bx bx-calendar'></i> 이번달 일정</div>
                    <button class="add-btn" id="addEventBtn"><i class='bx bx-plus'></i> 새 일정</button>
                </h2>
                <div class="widget-content" id="calendarWidget">
                    <div class="skeleton-loader">
                        <div class="skeleton-item"></div>
                        <div class="skeleton-item"></div>
                        <div class="skeleton-item"></div>
                    </div>
                </div>
            </section>

            <section class="widget widget-approvals" id="approvalSection">
                <h2>
                    <div class="widget-title"><i class='bx bx-edit-alt'></i> 결재 대기함</div>
                </h2>
                <div class="widget-content" id="approvalWidget">
                    <div class="skeleton-loader">
                        <div class="skeleton-item"></div>
                        <div class="skeleton-item"></div>
                    </div>
                </div>
            </section>

            <!-- 섹션 4: 최근 업무일지 + 본사재고 경고 -->
            <section class="widget widget-worklogs" id="worklogSection">
                <h2>
                    <div class="widget-title"><i class='bx bx-notepad'></i> 최근 업무일지</div>
                </h2>
                <div class="widget-content" id="workLogWidget">
                    <div class="skeleton-loader">
                        <div class="skeleton-item"></div>
                        <div class="skeleton-item"></div>
                    </div>
                </div>
            </section>

            <section class="widget widget-inventory" id="inventorySection">
                <h2>
                    <div class="widget-title"><i class='bx bx-error-circle'></i> 본사 재고 경고</div>
                </h2>
                <div class="widget-content" id="lowStockWidget">
                    <div class="skeleton-loader">
                        <div class="skeleton-item"></div>
                        <div class="skeleton-item"></div>
                    </div>
                </div>
            </section>

            <!-- 섹션 5: 진행 중 인보이스 + 셀러K 매입 변동 -->
            <section class="widget widget-invoices" id="invoiceSection">
                <h2>
                    <div class="widget-title"><i class='bx bx-file'></i> 진행 중 인보이스</div>
                </h2>
                <div class="widget-content" id="invoiceWidget">
                    <div class="skeleton-loader">
                        <div class="skeleton-item"></div>
                        <div class="skeleton-item"></div>
                    </div>
                </div>
            </section>

            <section class="widget widget-sellerk" id="sellerkSection">
                <h2>
                    <div class="widget-title"><i class='bx bx-store'></i> 셀러K 매입 변동</div>
                </h2>
                <div class="widget-content" id="recentSellerKWidget">
                    <div class="skeleton-loader">
                        <div class="skeleton-item"></div>
                        <div class="skeleton-item"></div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <!-- 이벤트 추가 모달 -->
    <div id="eventModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" id="closeEventModal"><i class='bx bx-x'></i></span>
            <h2>새 일정 추가</h2>
            <form id="eventForm">
                <div class="form-group">
                    <label>일정 제목</label>
                    <input type="text" id="eventSummary" required placeholder="예: 팀 회의">
                </div>
                <div class="form-group checkbox-group" style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
                    <input type="checkbox" id="eventAllDay" checked>
                    <label for="eventAllDay" style="margin: 0;">종일 일정</label>
                </div>
                <div class="form-group">
                    <label>시작</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="date" id="eventStartDate" required style="flex: 1;">
                        <input type="time" id="eventStartTime" style="flex: 1; display: none;">
                    </div>
                </div>
                <div class="form-group">
                    <label>종료</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="date" id="eventEndDate" required style="flex: 1;">
                        <input type="time" id="eventEndTime" style="flex: 1; display: none;">
                    </div>
                </div>
                <button type="submit" class="submit-btn">저장하기</button>
            </form>
        </div>
    </div>

    <!-- 모달: 즐겨찾기 추가 -->
    <div class="modal hidden" id="bookmarkModalOverlay">
        <div class="modal-content">
            <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <h3 style="margin: 0;"><i class='bx bx-bookmark-plus'></i> 즐겨찾기 설정</h3>
                <span class="close-btn" id="closeBookmarkModal"><i class='bx bx-x'></i></span>
            </div>
            <div class="modal-body">
                <form id="bookmarkForm">
                    <input type="hidden" id="bmSlotIndex">
                    <div class="form-group type-toggle">
                        <label>링크 유형</label>
                        <div class="radio-group" style="display: flex; gap: 16px; margin-top: 8px;">
                            <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
                                <input type="radio" name="bmType" value="internal" checked> 내부 메뉴
                            </label>
                            <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
                                <input type="radio" name="bmType" value="external"> 외부 웹 주소
                            </label>
                        </div>
                    </div>
                    
                    <!-- 내부 메뉴 선택 -->
                    <div class="form-group" id="bmInternalGroup">
                        <label>메뉴 선택</label>
                        <select id="bmInternalSelect" class="form-input" required>
                            <!-- JS에서 자동 채움 -->
                        </select>
                    </div>

                    <!-- 외부 주소 입력 -->
                    <div class="form-group hidden" id="bmExternalGroup">
                        <label>웹 주소 (URL)</label>
                        <input type="url" id="bmExternalUrl" class="form-input" placeholder="https://..." >
                        <label style="margin-top: 12px;">이름 (표시될 제목)</label>
                        <input type="text" id="bmExternalTitle" class="form-input" placeholder="예: 구글, 네이버">
                    </div>

                    <div class="modal-actions">
                        <button type="button" class="btn btn-danger hidden" id="btnDeleteBookmark" style="margin-right: auto;">삭제</button>
                        <button type="button" class="btn btn-secondary" id="btnCancelBookmark">취소</button>
                        <button type="submit" class="btn btn-primary">저장</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
