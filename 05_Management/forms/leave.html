<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>휴가원</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="leave.css">
</head>
<body>
    <div class="app-container">
        <main class="main-content">
            <!-- ═══ 목록 뷰 ═══ -->
            <div id="listView" class="view-section active">
                <div class="section-block">
                    <div class="panel">
                        <div class="panel-header">
                            <h2><i class='bx bx-calendar-event'></i> 휴가원 목록</h2>
                            <div class="header-actions">
                                <button id="btnNewLeave" class="btn-primary"><i class='bx bx-plus'></i> 새 휴가원</button>
                                <button id="btnDeleteSelected" class="btn-outline btn-outline-danger"><i class='bx bx-trash'></i> 선택 삭제</button>
                            </div>
                        </div>
                        <div class="print-warning">
                            <i class='bx bx-info-circle'></i>
                            <span>출력 버튼 클릭 후 브라우저 인쇄 설정에서 <b>여백: 기본값 또는 없음</b>, <b>용지: A4</b>로 설정해 주세요.</span>
                        </div>
                        <div class="table-responsive">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th class="col-check"><input type="checkbox" id="selectAll"></th>
                                        <th>작성일자</th>
                                        <th>소속</th>
                                        <th>직급</th>
                                        <th>성명</th>
                                        <th>기간</th>
                                        <th>구분</th>
                                        <th class="col-action">관리</th>
                                    </tr>
                                </thead>
                                <tbody id="leaveListBody">
                                    <tr class="loading-row"><td colspan="8"><div class="skeleton"></div></td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ═══ 편집/작성 모달 ═══ -->
            <div id="leaveEditModal" class="modal">
                <div class="modal-content" style="width: 95%; max-width: 900px; height: 90vh; display: flex; flex-direction: column; padding: 20px;">
                    <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; margin-bottom: 15px;">
                        <h2 id="editViewTitle" style="margin: 0;"><i class='bx bx-edit'></i> 휴가원 작성</h2>
                        <div class="header-actions" style="display: flex; gap: 8px;">
                            <button type="button" id="btnSaveLeave" class="btn-primary"><i class='bx bx-check'></i> 저장</button>
                            <button type="button" id="btnPrintLeave" class="btn-outline btn-outline-success"><i class='bx bx-printer'></i> 인쇄</button>
                            <button type="button" id="btnCloseEdit" class="btn-outline"><i class='bx bx-x'></i> 닫기</button>
                        </div>
                    </div>
                    
                    <div class="modal-body" style="overflow-y: auto; flex: 1; padding-right: 10px; display: flex; gap: 20px;">
                        <!-- 좌측: 입력 폼 -->
                        <div style="flex: 1; border-right: 1px solid #e2e8f0; padding-right: 20px;">
                            <form id="leaveForm" onsubmit="return false;">
                                <div class="leave-form-grid">
                                    <div class="fg">
                                        <label for="fDepartment">소속</label>
                                        <input type="text" id="fDepartment" value="주식회사 케앤지">
                                    </div>
                                    <div class="fg">
                                        <label for="fRank">직급</label>
                                        <input type="text" id="fRank" placeholder="예: 차장">
                                    </div>
                                    <div class="fg full-width">
                                        <label for="fName">성명</label>
                                        <input type="text" id="fName" placeholder="예: 박준영">
                                    </div>
                                    <div class="fg">
                                        <label for="fLeaveStart">휴가 시작일</label>
                                        <input type="date" id="fLeaveStart">
                                    </div>
                                    <div class="fg">
                                        <label for="fLeaveEnd">휴가 종료일</label>
                                        <input type="date" id="fLeaveEnd">
                                    </div>
                                    <div class="fg">
                                        <label for="fLeaveType">구분 (연차/반차)</label>
                                        <input type="text" id="fLeaveType" placeholder="예: 반차-오전">
                                    </div>
                                    <div class="fg">
                                        <label for="fSubmitDate">작성일자</label>
                                        <input type="date" id="fSubmitDate">
                                    </div>
                                    <div class="fg full-width">
                                        <label for="fReason">사유</label>
                                        <input type="text" id="fReason" placeholder="예: 개인일정 (잔여일수 7.5/13일)">
                                    </div>
                                </div>
                            </form>
                        </div>
                        
                        <!-- 우측: 인쇄 미리보기 레이아웃 (축소해서 보여줌) -->
                        <div style="flex: 1; background: #e2e8f0; padding: 20px; display: flex; justify-content: center; overflow: hidden; border-radius: 8px;">
                            <div style="transform: scale(0.45); transform-origin: top center; pointer-events: none;">
                                <!-- 인쇄 양식 영역 (여기에 실시간 렌더링) -->
                                <div id="printPreviewClone"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- ═══ 인쇄용 화면 (화면엔 안 보이고 인쇄 시에만 나타남) ═══ -->
    <div id="printArea" class="print-preview-container">
        <style type="text/css">
         #printArea .pdf-content * { margin:0; padding:0; text-indent:0; }
         #printArea .pdf-content h1 { color: black; font-family: 'Gulim', '굴림체', monospace; font-style: normal; font-weight: bold; text-decoration: underline; font-size: 24pt; letter-spacing: 0; }
         #printArea .pdf-content .s1 { color: black; font-family: 'Gulim', '굴림체', monospace; font-style: normal; font-weight: bold; text-decoration: none; font-size: 12pt; }
         #printArea .pdf-content p { color: black; font-family: 'Gulim', '굴림체', monospace; font-style: normal; font-weight: bold; text-decoration: none; font-size: 12pt; margin:0pt; }
         #printArea .pdf-content .s2 { color: black; font-family: 'Gulim', '굴림체', monospace; font-style: normal; font-weight: normal; text-decoration: none; font-size: 10pt; }
         #printArea .pdf-content .s3 { color: black; font-family: 'Century', serif; font-style: normal; font-weight: normal; text-decoration: none; font-size: 13pt; }
         #printArea .pdf-content table, #printArea .pdf-content tbody {vertical-align: top; overflow: visible; }
        </style>

        <!-- 배경 PDF가 깔릴 인쇄 영역 (A4 사이즈 고정) -->
        <div class="print-page pdf-content" style="border: none; padding: 0; margin: 0 auto; box-sizing: border-box; width: 210mm; height: 297mm; position: relative; font-family: 'Gulim', '굴림체', monospace;">
            
            <!-- 백그라운드 PDF 레이어 -->
            <iframe src="leave_bg.pdf#toolbar=0&navpanes=0&scrollbar=0" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; z-index: 0; pointer-events: none;"></iframe>
            
            <!-- 텍스트 데이터 오버레이 레이어 (z-index 10) -->
            <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; font-size: 12pt; font-weight: bold; color: black;">
                <span id="pDepartment" style="position: absolute; top: 277px; left: 240px; font-size: 13pt;"></span>
                <span id="pRank" style="position: absolute; top: 311px; left: 240px; font-size: 13pt;"></span>
                <span id="pName" style="position: absolute; top: 345px; left: 240px; font-size: 13pt;"></span>
                
                <span id="pPeriod" style="position: absolute; top: 484px; left: 198px; font-size: 13pt;"></span>
                <span id="pReason" style="position: absolute; top: 519px; left: 198px; font-size: 13pt;"></span>
                
                <span id="pDate" style="position: absolute; top: 671px; left: 593px; font-size: 13pt;"></span>
                
                <span id="pSignName" style="position: absolute; top: 705px; left: 593px; font-size: 13pt; letter-spacing: 4px;"></span>
            </div>
        </div>
    </div>

    <!-- ═══ Scripts ═══ -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../../app.js"></script>
    <script src="leave.js"></script>
</body>
</html>
