<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>입출고 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="../logistics-theme.css">
    <style>
        .lot-qty-input { width: 80px; text-align: right; }
        
        .autocomplete-suggestions { border: 1px solid #ced4da; max-height: 200px; overflow-y: auto; position: absolute; z-index: 1000; background: #fff; width: 100%; border-radius: 0 0 4px 4px; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .autocomplete-suggestion { padding: 8px; cursor: pointer; }
        .autocomplete-suggestion:hover { background-color: #f1f1f1; }
        
        #locationsModal .modal-body ul { list-style: none; padding: 0; }
        #locationsModal .modal-body li { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #f1f5f9; font-weight: 500; }
        
        .inbound-item-row { background: #fff; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; transition: border-color 0.2s; }
        .inbound-item-row:hover { border-color: #cbd5e1; }
        
        /* Drawer Styles */
        .drawer-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.4); z-index: 1040;
            opacity: 0; visibility: hidden; transition: 0.3s ease;
        }
        .drawer-overlay.show { opacity: 1; visibility: visible; }
        
        .bottom-drawer {
            position: fixed; bottom: -100%; left: 0; width: 100vw; 
            height: auto; max-height: 65vh;
            background: #fff; z-index: 1045;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.15);
            transition: bottom 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex; flex-direction: column;
            border-radius: 16px 16px 0 0;
        }
        .bottom-drawer.show { bottom: 0; }
        @media (max-width: 576px) { .bottom-drawer { max-height: 85vh; border-radius: 12px 12px 0 0; } }
        
        .drawer-header {
            padding: 0.75rem 1.25rem;
            border-bottom: 1px solid #e2e8f0;
            display: flex; justify-content: space-between; align-items: center;
        }
        .drawer-header.bg-inbound { background: #f0fdf4; border-left: 4px solid #10b981; }
        .drawer-header.bg-outbound { background: #fef2f2; border-left: 4px solid #ef4444; }
        .drawer-header.bg-detail { background: #f8fafc; border-left: 4px solid #3b82f6; }
        
        .drawer-body {
            padding: 1.5rem; flex: 1; overflow-y: auto;
        }
    </style>
</head>
<body class="bg-light">

<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0 fw-bold"><i class='bx bx-transfer text-primary'></i> 입출고 관리</h4>
        <div class="d-flex gap-2">
            <button class="btn btn-success" onclick="app.openDrawer('inbound_create')">
                <i class='bx bx-plus'></i> 입고 등록
            </button>
            <button class="btn btn-danger" onclick="app.openDrawer('outbound_create')">
                <i class='bx bx-minus'></i> 출고 등록
            </button>
            <button class="btn btn-outline-secondary" onclick="app.openLocationsModal()">
                <i class='bx bx-cog'></i> 위치 설정
            </button>
        </div>
    </div>

    <!-- 리스트 뷰 -->
    <div>
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="d-flex gap-3 align-items-center">
                            <div class="btn-group" role="group">
                                <input type="radio" class="btn-check" name="historyFilter" id="btnFilterAll" value="all" checked onchange="app.resetPageAndLoadHistory()">
                                <label class="btn btn-outline-primary btn-sm px-3" for="btnFilterAll">전체 보기</label>
                                
                                <input type="radio" class="btn-check" name="historyFilter" id="btnFilterIn" value="inbound" onchange="app.resetPageAndLoadHistory()">
                                <label class="btn btn-outline-primary btn-sm px-3" for="btnFilterIn">입고만 보기</label>
                                
                                <input type="radio" class="btn-check" name="historyFilter" id="btnFilterOut" value="outbound" onchange="app.resetPageAndLoadHistory()">
                                <label class="btn btn-outline-primary btn-sm px-3" for="btnFilterOut">출고만 보기</label>
                            </div>
                            <select class="form-select form-select-sm w-auto" id="historyLimit" onchange="app.resetPageAndLoadHistory()">
                                <option value="50">50개씩 보기</option>
                                <option value="100">100개씩 보기</option>
                                <option value="150">150개씩 보기</option>
                                <option value="200">200개씩 보기</option>
                            </select>
                        </div>
                        <div class="d-flex w-25 gap-2">
                            <input type="text" class="form-control form-control-sm" id="historySearch" placeholder="단순 검색..." onkeyup="if(event.key === 'Enter') app.resetPageAndLoadHistory()">
                            <button class="btn btn-sm btn-outline-secondary text-nowrap" onclick="app.openDetailedSearch()"><i class='bx bx-slider-alt'></i> 상세검색</button>
                        </div>
                    </div>
                    
                    <div class="table-responsive">
                        <table class="table table-hover align-middle" style="font-size: 0.9rem;">
                            <thead class="table-light sticky-top" style="z-index: 10;">
                                <tr>
                                    <th id="th-type" style="cursor:pointer" onclick="app.toggleSort('type')" class="user-select-none">구분<span class="sort-icon"></span></th>
                                    <th id="th-date" style="cursor:pointer" onclick="app.toggleSort('date')" class="user-select-none">일자<span class="sort-icon"> 🔽</span></th>
                                    <th id="th-party" style="cursor:pointer" onclick="app.toggleSort('party')" class="user-select-none">거래처<span class="sort-icon"></span></th>
                                    <th id="th-item" style="cursor:pointer" onclick="app.toggleSort('item')" class="user-select-none">품목명<span class="sort-icon"></span></th>
                                    <th id="th-spec" style="cursor:pointer" onclick="app.toggleSort('spec')" class="user-select-none">규격<span class="sort-icon"></span></th>
                                    <th id="th-unit" style="cursor:pointer" onclick="app.toggleSort('unit')" class="user-select-none">단위<span class="sort-icon"></span></th>
                                    <th id="th-qty" style="cursor:pointer" onclick="app.toggleSort('qty')" class="user-select-none">수량<span class="sort-icon"></span></th>
                                    <th id="th-price" style="cursor:pointer" onclick="app.toggleSort('price')" class="user-select-none">단가<span class="sort-icon"></span></th>
                                    <th class="text-center user-select-none">삭제</th>
                                </tr>
                            </thead>
                            <tbody id="historyTbody">
                                <tr><td colspan="9" class="text-center text-muted">데이터를 불러오는 중입니다...</td></tr>
                            </tbody>
                        </table>
                    </div>
                    
                    <!-- 페이지네이션 -->
                    <div class="d-flex justify-content-center mt-3">
                        <ul class="pagination pagination-sm mb-0" id="historyPagination">
                            <!-- JS 렌더링 영역 -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 통합 드로워 -->
<div id="drawerOverlay" class="drawer-overlay" onclick="app.closeDrawer()"></div>
<div id="bottomDrawer" class="bottom-drawer">
    <div class="drawer-header" id="drawerHeader">
        <h5 class="mb-0 fw-bold text-nowrap" id="drawerTitle">타이틀</h5>
        <div class="d-flex align-items-center justify-content-end w-100 ms-3">
            <div id="headerPrintControls" class="d-none align-items-center gap-2">
                <div class="btn-group btn-group-sm" role="group">
                    <input type="radio" class="btn-check" name="printType" id="printOptInbound" value="inbound_receipt">
                    <label class="btn btn-outline-primary" for="printOptInbound" id="printOptInboundLabel"><i class='bx bx-file'></i> 입고내역서</label>

                    <input type="radio" class="btn-check" name="printType" id="printOptOutbound" value="outbound_receipt">
                    <label class="btn btn-outline-primary" for="printOptOutbound" id="printOptOutboundLabel"><i class='bx bx-file'></i> 출고내역서</label>

                    <input type="radio" class="btn-check" name="printType" id="printOptTrans" value="transaction_statement" checked>
                    <label class="btn btn-outline-primary" for="printOptTrans" id="printOptTransLabel"><i class='bx bx-receipt'></i> 거래명세서</label>
                </div>
                <button class="btn btn-outline-secondary btn-sm" onclick="app.openCompanyPresetModal()" title="명세서 설정"><i class='bx bx-cog'></i></button>
                <button class="btn btn-primary btn-sm" onclick="app.printHistoryDetail()"><i class='bx bx-printer'></i> 인쇄</button>
            </div>
            <button type="button" class="btn-close ms-3" onclick="app.closeDrawer()"></button>
        </div>
    </div>
    <div class="drawer-body" id="drawerBody">
        
        <!-- 입고 폼 -->
        <div id="drawerInbound" class="d-none">
            <form id="inboundForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">입고일자</label>
                        <input type="date" class="form-control" id="in_date" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">매입처</label>
                        <input type="text" class="form-control" id="in_supplier" placeholder="매입처 입력" required>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">재고 위치</label>
                        <select class="form-select" id="in_location" required>
                            <option value="">로딩 중...</option>
                        </select>
                    </div>
                </div>

                <hr class="my-4 text-muted">

                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="fw-bold mb-0">입고 품목 내역</h6>
                    <button type="button" class="btn btn-sm btn-outline-primary" onclick="app.addInboundItemRow()"><i class='bx bx-plus'></i> 추가</button>
                </div>

                <div id="inboundItemsContainer">
                    <!-- app.js에서 렌더링 -->
                </div>

                <div class="mt-4 text-end">
                    <button type="submit" class="btn btn-success w-100"><i class='bx bx-check'></i> 입고 처리</button>
                </div>
            </form>
        </div>
        
        <!-- 출고 폼 -->
        <div id="drawerOutbound" class="d-none">
            <form id="outboundForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">출고일자</label>
                        <input type="date" class="form-control" id="out_date" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">출고처(고객/현장)</label>
                        <input type="text" class="form-control" id="out_destination" placeholder="출고처 입력" required>
                    </div>
                </div>

                <hr class="my-4 text-muted">

                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="fw-bold mb-0">출고 품목 내역</h6>
                    <button type="button" class="btn btn-outline-primary btn-sm px-3" onclick="app.addOutboundItemRow()"><i class='bx bx-plus'></i> 추가</button>
                </div>

                <div id="outboundItemsContainer">
                    <!-- JS Render -->
                </div>

                <div class="mt-4">
                    <small class="text-danger fw-bold d-block mb-2" id="outErrorMsg" style="display:none;"><i class='bx bx-error'></i> 모든 품목의 Lot 설정을 완료해야 출고 처리가 가능합니다.</small>
                    <button type="submit" class="btn btn-danger w-100" id="btnOutboundSubmit"><i class='bx bx-check-double'></i> 출고 처리</button>
                </div>
            </form>
        </div>
        
        <!-- 상세 정보 -->
        <div id="drawerDetail" class="d-none">
            <div id="drawerDetailContent" class="mb-3">
                <!-- JS Render -->
            </div>
            
        </div>

    </div>
</div>

<!-- 상세 검색 모달 -->
<div class="modal fade" id="detailedSearchModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fs-6 fw-bold">상세 조건 검색</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="dsForm">
                    <div class="row g-3">
                        <div class="col-6">
                            <label class="form-label mb-1 text-secondary" style="font-size:0.85rem">시작 일자</label>
                            <input type="date" class="form-control" id="ds_start_date">
                        </div>
                        <div class="col-6">
                            <label class="form-label mb-1 text-secondary" style="font-size:0.85rem">종료 일자</label>
                            <input type="date" class="form-control" id="ds_end_date">
                        </div>
                        <div class="col-12">
                            <label class="form-label mb-1 text-secondary" style="font-size:0.85rem">거래처 (포함)</label>
                            <input type="text" class="form-control" id="ds_party" placeholder="예: 동서울강남">
                        </div>
                        <div class="col-12">
                            <label class="form-label mb-1 text-secondary" style="font-size:0.85rem">품목명 (포함)</label>
                            <input type="text" class="form-control" id="ds_item" placeholder="예: TMT-100">
                        </div>
                        <div class="col-12">
                            <label class="form-label mb-1 text-secondary" style="font-size:0.85rem">규격 (포함)</label>
                            <input type="text" class="form-control" id="ds_spec" placeholder="예: 25KG">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" onclick="app.resetDetailedSearch()">초기화</button>
                <button type="button" class="btn btn-primary" onclick="app.applyDetailedSearch()">검색 적용</button>
            </div>
        </div>
    </div>
</div>

<!-- 위치 설정 모달 -->
<div class="modal fade" id="locationsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fs-6 fw-bold">재고 위치 관리</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <ul id="locationList">
                    <!-- 로케이션 리스트 렌더링 -->
                </ul>
                <div class="input-group mt-3">
                    <input type="text" class="form-control form-control-sm" id="newLocationInput" placeholder="새 창고/현장 이름">
                    <button class="btn btn-primary btn-sm" onclick="app.addLocation()">추가</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Lot 차감 조절 모달 -->
<div class="modal fade" id="lotModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fs-6 fw-bold"><span id="lotModalItemTitle"></span> Lot 설정</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="alert alert-info py-2 px-3 mb-3 d-flex justify-content-between align-items-center">
                    <span><strong>필요 수량: </strong><span id="lotModalReqQty">0</span></span>
                    <span><strong>현재 할당량: </strong><span id="lotModalCurQty">0</span></span>
                </div>
                <div class="table-responsive bg-white rounded shadow-sm border border-light">
                    <table class="table mb-0">
                        <thead>
                            <tr>
                                <th>입고일자</th>
                                <th>위치</th>
                                <th>매입처</th>
                                <th>입고단가</th>
                                <th>현재 잔여량</th>
                                <th class="table-primary text-primary">출고 차감량</th>
                            </tr>
                        </thead>
                        <tbody id="lotModalTbody">
                            <!-- JS Render -->
                        </tbody>
                    </table>
                </div>
                <div class="fw-bold text-danger mt-2" id="lotModalErrorMsg" style="display: none;"><i class='bx bx-error'></i> 차감량 합계가 총 출고 수량과 일치하지 않습니다.</div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                <button type="button" class="btn btn-primary" onclick="app.saveLotModal()">저장 (확인)</button>
            </div>
            </div>
        </div>
    </div>
</div>


<!-- 거래명세서 공급자 설정 모달 -->
<div class="modal fade" id="companyPresetModal" tabindex="-1" aria-hidden="true" style="z-index: 1060;">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fs-6 fw-bold">거래명세서 공급자 정보 설정</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-2">
                    <label class="form-label">사업자등록번호</label>
                    <input type="text" class="form-control" id="preset_bizNo">
                </div>
                <div class="mb-2">
                    <label class="form-label">상호 (법인명)</label>
                    <input type="text" class="form-control" id="preset_bizName">
                </div>
                <div class="mb-2">
                    <label class="form-label">대표자성명</label>
                    <input type="text" class="form-control" id="preset_ceo">
                </div>
                <div class="mb-2">
                    <label class="form-label">사업장 주소</label>
                    <input type="text" class="form-control" id="preset_address">
                </div>
                <div class="row">
                    <div class="col mb-2">
                        <label class="form-label">업태</label>
                        <input type="text" class="form-control" id="preset_bizType">
                    </div>
                    <div class="col mb-2">
                        <label class="form-label">종목</label>
                        <input type="text" class="form-control" id="preset_bizItem">
                    </div>
                </div>
                <small class="text-muted mt-2 d-block">* 저장된 정보는 사용자의 현재 브라우저에만 저장되며 거래명세서 인쇄 시 기본값으로 사용됩니다.</small>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                <button type="button" class="btn btn-primary" onclick="app.saveCompanyPreset()">저장</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Firebase & Auth -->
<script type="module">
    // (Firebase 설정은 다른 페이지와 동일하게 적용 필요 시 추가, 여기서는 백엔드 API만 사용)
</script>
<script src="app.js?v=1"></script>
</body>
</html>
