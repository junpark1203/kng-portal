<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>입출고 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../styles.css">
    <style>
        .nav-tabs .nav-link { color: #555; font-weight: 500; border-radius: 8px 8px 0 0; }
        .nav-tabs .nav-link.active { font-weight: bold; color: #0d6efd; }
        .form-label { font-weight: 600; font-size: 0.9rem; color: #495057; }
        .lot-table th { background-color: #f8f9fa; font-size: 0.85rem; text-align: center; }
        .lot-table td { vertical-align: middle; font-size: 0.9rem; text-align: center; }
        .lot-qty-input { width: 80px; text-align: right; }
        
        .autocomplete-suggestions { border: 1px solid #ced4da; max-height: 200px; overflow-y: auto; position: absolute; z-index: 1000; background: #fff; width: 100%; border-radius: 0 0 4px 4px; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .autocomplete-suggestion { padding: 8px; cursor: pointer; }
        .autocomplete-suggestion:hover { background-color: #f1f1f1; }
        
        #locationsModal .modal-body ul { list-style: none; padding: 0; }
        #locationsModal .modal-body li { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #eee; }
        
        .card-header { background-color: #fff; border-bottom: 2px solid #f4f6f9; }
    </style>
</head>
<body class="bg-light">

<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0 fw-bold"><i class='bx bx-transfer text-primary'></i> 입출고 관리</h4>
        <div>
            <button class="btn btn-outline-secondary btn-sm" onclick="app.openLocationsModal()">
                <i class='bx bx-cog'></i> 위치 설정
            </button>
        </div>
    </div>

    <!-- 탭 내비게이션 -->
    <ul class="nav nav-tabs mb-4" id="inoutTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="inbound-tab" data-bs-toggle="tab" data-bs-target="#inbound" type="button" role="tab">📦 입고 등록</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="outbound-tab" data-bs-toggle="tab" data-bs-target="#outbound" type="button" role="tab">🚚 출고 등록</button>
        </li>
    </ul>

    <!-- 탭 콘텐츠 -->
    <div class="tab-content" id="inoutTabContent">
        
        <!-- 입고 폼 -->
        <div class="tab-pane fade show active" id="inbound" role="tabpanel">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <form id="inboundForm">
                        <div class="row g-3">
                            <div class="col-md-3">
                                <label class="form-label">입고일자</label>
                                <input type="date" class="form-control" id="in_date" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">매입처</label>
                                <input type="text" class="form-control" id="in_supplier" placeholder="매입처 입력" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">재고 위치</label>
                                <select class="form-select" id="in_location" required>
                                    <option value="">로딩 중...</option>
                                </select>
                            </div>
                        </div>

                        <hr class="my-4 text-muted">

                        <div class="row g-3">
                            <div class="col-md-3 position-relative">
                                <label class="form-label">품목</label>
                                <input type="text" class="form-control" id="in_item" placeholder="품목명 입력 또는 선택" autocomplete="off" required>
                                <div id="in_item_suggestions" class="autocomplete-suggestions"></div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">규격</label>
                                <input type="text" class="form-control" id="in_spec" placeholder="규격 입력" required>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">단위</label>
                                <input type="text" class="form-control" id="in_unit" placeholder="EA, BOX 등" required>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">수량</label>
                                <input type="number" class="form-control" id="in_qty" min="0.01" step="0.01" required>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">매입단가 (₩)</label>
                                <input type="number" class="form-control" id="in_unit_price" min="0" step="1" required>
                            </div>
                        </div>

                        <div class="mt-4 text-end">
                            <button type="submit" class="btn btn-primary px-4"><i class='bx bx-check'></i> 입고 처리</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- 출고 폼 -->
        <div class="tab-pane fade" id="outbound" role="tabpanel">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <form id="outboundForm">
                        <div class="row g-3">
                            <div class="col-md-3">
                                <label class="form-label">출고일자</label>
                                <input type="date" class="form-control" id="out_date" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">출고처(고객/현장)</label>
                                <input type="text" class="form-control" id="out_destination" placeholder="출고처 입력" required>
                            </div>
                        </div>

                        <hr class="my-4 text-muted">

                        <div class="row g-3">
                            <div class="col-md-3 position-relative">
                                <label class="form-label">품목 조회 <small class="text-muted">(재고 보유)</small></label>
                                <input type="text" class="form-control" id="out_item" placeholder="재고가 있는 품목 검색" autocomplete="off" required>
                                <div id="out_item_suggestions" class="autocomplete-suggestions"></div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">규격 선택</label>
                                <select class="form-select" id="out_spec" disabled required>
                                    <option value="">품목을 먼저 선택하세요</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">총 출고 수량</label>
                                <input type="number" class="form-control" id="out_qty" min="0.01" step="0.01" disabled required>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">판매단가 (₩)</label>
                                <input type="number" class="form-control" id="out_selling_price" min="0" step="1" required>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">배송비 (₩)</label>
                                <input type="number" class="form-control" id="out_shipping_fee" min="0" step="1" value="0" required>
                            </div>
                        </div>

                        <!-- Lot 차감 정보 (자동 노출) -->
                        <div id="lotDeductionSection" class="mt-4" style="display: none;">
                            <div class="card border border-primary border-opacity-25 bg-primary bg-opacity-10">
                                <div class="card-body p-3">
                                    <h6 class="text-primary fw-bold mb-3"><i class='bx bx-list-ol'></i> Lot 차감 예정 내역 (자동 선입선출 추천)</h6>
                                    <div class="table-responsive">
                                        <table class="table table-sm table-bordered lot-table mb-0 bg-white">
                                            <thead>
                                                <tr>
                                                    <th>입고일자</th>
                                                    <th>위치</th>
                                                    <th>매입처</th>
                                                    <th>입고단가</th>
                                                    <th>현재 잔여량</th>
                                                    <th class="table-primary text-primary">출고 차감량</th>
                                                </tr>
                                            </thead>
                                            <tbody id="lotTbody">
                                                <!-- JS Render -->
                                            </tbody>
                                        </table>
                                    </div>
                                    <div class="d-flex justify-content-between align-items-center mt-2">
                                        <small class="text-muted">* 위 내역은 선입선출(FIFO) 기준으로 자동 계산되었습니다. 필요시 '출고 차감량'을 수동으로 조절할 수 있습니다.</small>
                                        <div class="fw-bold text-danger" id="lotErrorMsg" style="display: none;">차감량 합계가 총 출고 수량과 일치하지 않습니다.</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="mt-4 text-end">
                            <button type="submit" class="btn btn-success px-4" id="btnOutboundSubmit" disabled><i class='bx bx-check-double'></i> 출고 처리</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 위치 설정 모달 -->
<div class="modal fade" id="locationsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fs-6 fw-bold">재고 위치 관리</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <ul id="locationList">
                    <!-- 로케이션 리스트 렌더링 -->
                </ul>
                <div class="input-group mt-3">
                    <input type="text" class="form-control form-control-sm" id="newLocationInput" placeholder="새 창고/현장 이름">
                    <button class="btn btn-primary btn-sm" onclick="app.addLocation()">추가</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Firebase & Auth -->
<script type="module">
    // (Firebase 설정은 다른 페이지와 동일하게 적용 필요 시 추가, 여기서는 백엔드 API만 사용)
</script>
<script src="app.js?v=1"></script>
</body>
</html>
