<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 재고 현황 (물류 관리)</title>
    <!-- Bootstrap 5 & Boxicons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <!-- Common Design Systems -->
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="../logistics-theme.css">
    <link rel="stylesheet" href="../../Common/css/erp-grid.css">
    <!-- 모듈 전용 고도화 ECOUNT ERP 스타일시트 -->
    <link rel="stylesheet" href="style.css?v=20260915_1">
</head>
<body>

    <!-- ── 1. ECOUNT ERP 1행 탑 툴바 (타이틀 + 통계 + 자재분류 탭 + 액션 버튼) ── -->
    <div class="erp-top-toolbar no-print">
        <div class="d-flex align-items-center gap-2 flex-wrap">
            <span class="erp-title-tag">
                <i class='bx bx-box text-primary'></i> 통합 물류 실시간 재고
            </span>

            <div class="erp-badge-group">
                <span class="erp-stat-badge badge-dark" id="skuCountBadge">관리 0 SKU</span>
                <span class="erp-stat-badge badge-blue" id="totalQtyBadge">총 재고: 0개</span>
            </div>

            <!-- 자재 분류 퀵 필터 탭 -->
            <div class="erp-tab-group ms-1" id="categoryTabGroup">
                <button type="button" class="erp-tab-btn active" data-category="" onclick="app.setCategoryFilter('')">전체</button>
                <button type="button" class="erp-tab-btn" data-category="안전자재" onclick="app.setCategoryFilter('안전자재')">안전자재</button>
                <button type="button" class="erp-tab-btn" data-category="토목자재" onclick="app.setCategoryFilter('토목자재')">토목자재</button>
                <button type="button" class="erp-tab-btn" data-category="보양재" onclick="app.setCategoryFilter('보양재')">보양재</button>
                <button type="button" class="erp-tab-btn" data-category="소모품" onclick="app.setCategoryFilter('소모품')">소모품</button>
                <button type="button" class="erp-tab-btn" data-category="일반자재" onclick="app.setCategoryFilter('일반자재')">일반자재</button>
            </div>
        </div>

        <div class="d-flex align-items-center gap-1 flex-wrap">
            <button type="button" class="btn-erp" onclick="app.exportExcel()" title="현재 조회된 재고 목록 엑셀 내보내기">
                <i class='bx bx-download'></i> 엑셀 다운로드
            </button>
            <button type="button" class="btn-erp text-muted" onclick="app.printPage()" title="화면 인쇄">
                <i class='bx bx-printer'></i> 인쇄
            </button>
            <a href="../inout/index.html" class="btn-erp" title="사내 입출고 관리로 이동">
                <i class='bx bx-transfer'></i> 사내 입출고
            </a>
            <a href="../external_inout/index.html" class="btn-erp" title="외주/직출고 관리로 이동">
                <i class='bx bx-archive-out'></i> 외주/직출고
            </a>
        </div>
    </div>

    <!-- ── 2. ECOUNT ERP 2행 필터 리본 (스마트 다중 검색 + 재검색 + 그리드 유틸) ── -->
    <div class="erp-filter-ribbon no-print">
        <div class="d-flex align-items-center gap-1 flex-wrap">
            <!-- 검색 대상 선택 -->
            <select class="form-select erp-select-target" id="searchTarget" onchange="app.onSearchTargetChange()">
                <option value="">전체 대상</option>
                <option value="item">품목명</option>
                <option value="spec">규격</option>
                <option value="location">보관위치</option>
                <option value="supplier">매입처</option>
            </select>

            <!-- 스마트 다중 검색창 -->
            <div class="position-relative erp-search-box">
                <input type="text" class="form-control form-control-sm" id="historySearch" placeholder="스마트 다중 검색 (공백 구분)..." onkeyup="app.onSearchInputKeyup(event)" title="공백으로 여러 단어를 입력하면 스마트 교집합(AND) 검색이 지원됩니다">
                <button type="button" class="btn btn-link btn-sm text-muted position-absolute end-0 top-50 translate-middle-y text-decoration-none p-0 pe-1 d-none" id="clearSearchBtn" onclick="app.clearSearchInput()" title="지우기" style="font-size: 0.75rem;">
                    <i class='bx bx-x-circle'></i>
                </button>
            </div>

            <button type="button" class="btn-erp btn-erp-primary" onclick="app.search()"><i class='bx bx-search'></i> 검색</button>
            <button type="button" class="btn-erp" onclick="app.resetSearch()"><i class='bx bx-reset'></i> 초기화</button>
        </div>

        <div class="d-flex align-items-center gap-1 flex-wrap">
            <!-- 결과 내 재검색 인풋 -->
            <div class="input-group input-group-sm erp-subsearch-group">
                <span class="input-group-text bg-white border-end-0 py-0 text-muted" style="padding: 0 4px;"><i class='bx bx-filter'></i></span>
                <input type="text" id="subSearchInput" class="form-control border-start-0 border-end-0 py-0" placeholder="결과 내 재검색..." oninput="app.onSubSearchInput(this.value)" style="font-size: 11.5px; height: 24px;">
                <button class="btn btn-outline-secondary border-start-0 py-0 text-muted d-none" type="button" id="clearSubSearchBtn" onclick="app.clearSubSearch()" style="height: 24px; padding: 0 4px;"><i class='bx bx-x'></i></button>
            </div>

            <!-- 열 너비 조절 도구 버튼 -->
            <button type="button" class="erp-tool-btn" onclick="window.ErpGridResizer.autoFitAll('inventoryTable')" title="데이터 길이에 맞춰 모든 열 너비를 자동으로 맞춥니다">
                <i class='bx bx-expand-horizontal text-primary'></i> 열 너비 자동맞춤
            </button>
            <button type="button" class="erp-tool-btn" onclick="window.ErpGridResizer.resetWidths('inventoryTable')" title="열 너비를 기본값으로 초기화합니다">
                <i class='bx bx-reset text-secondary'></i> 기본값 초기화
            </button>
        </div>
    </div>

    <!-- ── 3. ERP 고밀도 시트 그리드 (10개 컬럼 최적화 체제) ── -->
    <div class="erp-grid-wrapper shadow-sm" id="inventoryGridWrapper">
        <table id="inventoryTable" class="erp-sheet-table">
            <thead>
                <tr>
                    <th class="th-toggle" style="width: 32px;"></th>
                    <th class="th-no" style="width: 40px;">No.</th>
                    <th class="th-category" style="width: 85px;">자재분류</th>
                    <th class="th-item text-start ps-2" style="min-width: 220px;">품목명</th>
                    <th class="th-spec text-start ps-2" style="width: 140px;">규격</th>
                    <th class="th-unit" style="width: 55px;">단위</th>
                    <th class="th-location text-start ps-2" style="width: 110px;">보관 위치</th>
                    <th class="th-lots" style="width: 65px;">Lot 수</th>
                    <th class="th-latest-date" style="width: 85px;">최종 입고일</th>
                    <th class="th-qty text-end pe-3" style="width: 100px;">총 재고수량</th>
                </tr>
            </thead>
            <tbody id="inventoryTbody">
                <tr><td colspan="10" class="text-center py-5 text-muted"><i class='bx bx-loader-alt bx-spin'></i> 재고 데이터를 불러오는 중입니다...</td></tr>
            </tbody>
            <tfoot id="inventoryTfoot" class="d-none">
                <tr>
                    <td colspan="3" class="text-center bg-light fw-bold text-secondary">합계</td>
                    <td colspan="6" class="ps-2 fw-bold text-dark" id="footSkuSummary">총 0개 품목</td>
                    <td class="text-end pe-3 text-primary fw-bold fs-6" id="footQtySummary">0</td>
                </tr>
            </tfoot>
        </table>
    </div>

    <!-- 외부 라이브러리 (Bootstrap, SheetJS, GridResizer) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="../../Common/js/erp-grid-resizer.js"></script>
    <script src="app.js?v=20260915_1"></script>
</body>
</html>
