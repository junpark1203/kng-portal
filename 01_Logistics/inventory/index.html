<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>실시간재고 (영업관리)</title>
    <!-- Bootstrap 5 & Boxicons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <!-- Common Design Systems -->
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="../logistics-theme.css">
    <link rel="stylesheet" href="../../Common/css/erp-grid.css">
    <!-- 모듈 전용 고도화 ECOUNT ERP 스타일시트 -->
    <link rel="stylesheet" href="style.css?v=20261007_1">
</head>
<body>

    <!-- ══════════════════════════════════════════════════════════════
         모바일 전용 상단 헤더 (≤ 768px)
         ══════════════════════════════════════════════════════════════ -->
    <div class="mobile-inventory-header d-md-none">
        <!-- 1행: 뒤로가기 + 타이틀 + SKU 뱃지 + 우측 액션 툴바 -->
        <div class="d-flex align-items-center justify-content-between mb-2">
            <div class="d-flex align-items-center gap-1 min-w-0" style="overflow: hidden;">
                <a href="../../index.html" class="mobile-head-btn text-dark text-decoration-none" title="메인 포털로 이동">
                    <i class='bx bx-left-arrow-alt fs-5'></i>
                </a>
                <div class="d-inline-flex align-items-center gap-1 text-truncate">
                    <span class="mobile-header-title text-truncate">
                        <i class='bx bx-box text-primary'></i> 실시간 재고
                    </span>
                    <span class="badge bg-primary-subtle text-primary border border-primary-subtle flex-shrink-0" id="mobileHeaderSkuBadge" style="font-size: 11px; padding: 2px 6px;">0 SKU</span>
                </div>
            </div>

            <div class="d-flex align-items-center gap-1 flex-shrink-0">
                <!-- 뷰 모드 전환 (카드 / 표 아이콘 버튼) -->
                <div class="btn-group btn-group-sm mobile-view-toggle" role="group">
                    <button type="button" class="btn btn-outline-secondary mobile-icon-toggle active" id="btnViewCard" onclick="app.setViewMode('card')" title="모바일 카드 뷰">
                        <i class='bx bx-grid-alt'></i>
                    </button>
                    <button type="button" class="btn btn-outline-secondary mobile-icon-toggle" id="btnViewTable" onclick="app.setViewMode('table')" title="ERP 테이블 뷰">
                        <i class='bx bx-table'></i>
                    </button>
                </div>

                <!-- 필터 열기 토글 버튼 -->
                <div class="position-relative">
                    <button type="button" class="mobile-head-btn btn-outline-primary" id="btnToggleMobileFilter" onclick="app.toggleMobileFilter()" title="검색 및 필터">
                        <i class='bx bx-filter-alt'></i>
                    </button>
                    <span class="mobile-filter-badge d-none" id="mobileFilterDot"></span>
                </div>

                <!-- 기타 액션 드롭다운 -->
                <div class="dropdown">
                    <button class="mobile-head-btn btn-light border text-secondary" type="button" data-bs-toggle="dropdown" title="더보기">
                        <i class='bx bx-dots-vertical-rounded'></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                        <li><a class="dropdown-item py-2" href="javascript:void(0)" onclick="app.exportExcel()"><i class='bx bx-download text-success me-2'></i> 엑셀 다운로드</a></li>
                        <li><a class="dropdown-item py-2" href="../inout/index.html"><i class='bx bx-transfer text-primary me-2'></i> 사내 입출고 바로가기</a></li>
                        <li><a class="dropdown-item py-2" href="../external_inout/index.html"><i class='bx bx-archive-out text-info me-2'></i> 외주/직출고 바로가기</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item py-2" href="javascript:void(0)" onclick="app.printPage()"><i class='bx bx-printer text-secondary me-2'></i> 화면 인쇄</a></li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- 2행: 모바일 검색창 -->
        <div class="mobile-search-strip mb-2">
            <div class="input-group input-group-sm shadow-sm">
                <span class="input-group-text bg-white border-end-0"><i class='bx bx-search text-muted'></i></span>
                <input type="text" class="form-control border-start-0 border-end-0" id="mobileSearchInput" placeholder="품목명, 규격, 보관위치, 매입처 검색..." autocomplete="off" onkeyup="if(event.key==='Enter')app.submitMobileSearch()">
                <button class="btn btn-outline-secondary border-start-0 d-none" type="button" id="mobileClearSearchBtn" onclick="app.clearMobileSearch()"><i class='bx bx-x'></i></button>
                <button class="btn btn-primary px-3" type="button" onclick="app.submitMobileSearch()">검색</button>
            </div>
        </div>

        <!-- 3행: 가로 스와이프 카테고리 칩 바 -->
        <div class="mobile-cat-scroll-wrapper mb-2">
            <div class="category-pills-scroll-track" id="mobileCategoryScrollTrack">
                <button type="button" class="btn btn-sm btn-primary text-white shadow-sm fw-bold rounded-pill px-3 flex-shrink-0" onclick="app.setCategoryFilter('')">전체보기</button>
            </div>
        </div>

        <!-- 4행: 초슬림 1라인 KPI 요약 바 -->
        <div class="mobile-inv-kpi-bar shadow-sm">
            <div class="d-flex align-items-center gap-2">
                <span class="kpi-item"><i class='bx bx-check-shield text-primary'></i> 관리 <strong id="mobileKpiSku">0</strong><small>SKU</small></span>
                <span class="text-muted">|</span>
                <span class="kpi-item"><i class='bx bx-layer text-success'></i> 총 재고 <strong class="text-primary" id="mobileKpiQty">0</strong><small>개</small></span>
            </div>
            <span class="badge bg-light text-secondary border text-truncate" id="mobileKpiFilteredText" style="max-width: 140px;">전체 품목</span>
        </div>
    </div>

    <!-- ── 1. ECOUNT ERP 1행 탑 툴바 (데스크톱 전용) ── -->
    <div class="erp-top-toolbar no-print d-none d-md-flex">
        <div class="d-flex align-items-center gap-2 flex-wrap">
            <span class="erp-title-tag">
                <i class='bx bx-box text-primary'></i> 통합 물류 실시간 재고
            </span>

            <div class="erp-badge-group">
                <span class="erp-stat-badge badge-dark" id="skuCountBadge">관리 0 SKU</span>
                <span class="erp-stat-badge badge-blue" id="totalQtyBadge">총 재고: 0개</span>
            </div>

            <!-- 자재 분류 퀵 필터 탭 -->
            <div class="erp-tab-group ms-1" id="categoryTabGroup">
                <button type="button" class="erp-tab-btn active" data-category="" onclick="app.setCategoryFilter('')">전체</button>
            </div>
        </div>

        <div class="d-flex align-items-center gap-1 flex-wrap">
            <button type="button" class="btn-erp" onclick="app.exportExcel()" title="현재 조회된 재고 목록 엑셀 내보내기">
                <i class='bx bx-download'></i> 엑셀 다운로드
            </button>
            <button type="button" class="btn-erp text-muted" onclick="app.printPage()" title="화면 인쇄">
                <i class='bx bx-printer'></i> 인쇄
            </button>
            <a href="../inout/index.html" class="btn-erp" title="사내 입출고 관리로 이동">
                <i class='bx bx-transfer'></i> 사내 입출고
            </a>
            <a href="../external_inout/index.html" class="btn-erp" title="외주/직출고 관리로 이동">
                <i class='bx bx-archive-out'></i> 외주/직출고
            </a>
        </div>
    </div>

    <!-- ── 2. ECOUNT ERP 2행 필터 리본 (데스크톱 전용) ── -->
    <div class="erp-filter-ribbon no-print d-none d-md-flex">
        <div class="d-flex align-items-center gap-1 flex-wrap">
            <!-- 검색 대상 선택 -->
            <select class="form-select erp-select-target" id="searchTarget" onchange="app.onSearchTargetChange()">
                <option value="">전체 대상</option>
                <option value="item">품목명</option>
                <option value="spec">규격</option>
                <option value="location">보관위치</option>
                <option value="supplier">매입처</option>
            </select>

            <!-- 스마트 다중 검색창 -->
            <div class="position-relative erp-search-box">
                <input type="text" class="form-control form-control-sm" id="historySearch" placeholder="스마트 다중 검색 (공백 구분)..." onkeyup="app.onSearchInputKeyup(event)" title="공백으로 여러 단어를 입력하면 스마트 교집합(AND) 검색이 지원됩니다">
                <button type="button" class="btn btn-link btn-sm text-muted position-absolute end-0 top-50 translate-middle-y text-decoration-none p-0 pe-1 d-none" id="clearSearchBtn" onclick="app.clearSearchInput()" title="지우기" style="font-size: 0.75rem;">
                    <i class='bx bx-x-circle'></i>
                </button>
            </div>

            <button type="button" class="btn-erp btn-erp-primary" onclick="app.search()"><i class='bx bx-search'></i> 검색</button>
            <button type="button" class="btn-erp" onclick="app.resetSearch()"><i class='bx bx-reset'></i> 초기화</button>
        </div>

        <div class="d-flex align-items-center gap-1 flex-wrap">
            <!-- 결과 내 재검색 인풋 -->
            <div class="input-group input-group-sm erp-subsearch-group">
                <span class="input-group-text bg-white border-end-0 py-0 text-muted" style="padding: 0 4px;"><i class='bx bx-filter'></i></span>
                <input type="text" id="subSearchInput" class="form-control border-start-0 border-end-0 py-0" placeholder="결과 내 재검색..." oninput="app.onSubSearchInput(this.value)" style="font-size: 11.5px; height: 24px;">
                <button class="btn btn-outline-secondary border-start-0 py-0 text-muted d-none" type="button" id="clearSubSearchBtn" onclick="app.clearSubSearch()" style="height: 24px; padding: 0 4px;"><i class='bx bx-x'></i></button>
            </div>

            <!-- 열 너비 조절 도구 버튼 -->
            <button type="button" class="erp-tool-btn" onclick="window.ErpGridResizer.autoFitAll('inventoryTable')" title="데이터 길이에 맞춰 모든 열 너비를 자동으로 맞춥니다">
                <i class='bx bx-expand-horizontal text-primary'></i> 열 너비 자동맞춤
            </button>
            <button type="button" class="erp-tool-btn" onclick="window.ErpGridResizer.resetWidths('inventoryTable')" title="열 너비를 기본값으로 초기화합니다">
                <i class='bx bx-reset text-secondary'></i> 기본값 초기화
            </button>
        </div>
    </div>

    <!-- ── 3. 모바일 전용 카드 뷰 컨테이너 (≤ 768px 기본 노출) ── -->
    <div id="inventoryCardsContainer" class="inventory-cards-container d-md-none">
        <div class="text-center py-5 text-muted">
            <i class='bx bx-loader-alt bx-spin fs-1 mb-2'></i>
            <div>재고 데이터를 불러오는 중입니다...</div>
        </div>
    </div>

    <!-- ── 4. ERP 고밀도 시트 그리드 (데스크톱 기본 / 모바일 전환 가능) ── -->
    <div class="erp-grid-wrapper shadow-sm mobile-hidden-table" id="inventoryGridWrapper">
        <table id="inventoryTable" class="erp-sheet-table">
            <thead>
                <tr>
                    <th class="th-toggle" style="width: 32px;"></th>
                    <th class="th-no" style="width: 40px;">No.</th>
                    <th class="th-category" style="width: 85px;">자재분류</th>
                    <th class="th-item text-start ps-2" style="min-width: 220px;">품목명</th>
                    <th class="th-spec text-start ps-2" style="width: 140px;">규격</th>
                    <th class="th-unit" style="width: 55px;">단위</th>
                    <th class="th-location text-start ps-2" style="width: 110px;">보관 위치</th>
                    <th class="th-lots" style="width: 65px;">Lot 수</th>
                    <th class="th-latest-date" style="width: 85px;">최종 입고일</th>
                    <th class="th-qty text-end pe-3" style="width: 100px;">총 재고수량</th>
                </tr>
            </thead>
            <tbody id="inventoryTbody">
                <tr><td colspan="10" class="text-center py-5 text-muted"><i class='bx bx-loader-alt bx-spin'></i> 재고 데이터를 불러오는 중입니다...</td></tr>
            </tbody>
            <tfoot id="inventoryTfoot" class="d-none">
                <tr>
                    <td colspan="3" class="text-center bg-light fw-bold text-secondary">합계</td>
                    <td colspan="6" class="ps-2 fw-bold text-dark" id="footSkuSummary">총 0개 품목</td>
                    <td class="text-end pe-3 text-primary fw-bold fs-6" id="footQtySummary">0</td>
                </tr>
            </tfoot>
        </table>
    </div>

    <!-- ── 5. 모바일 전용 필터 바텀시트 드로어 ── -->
    <div class="mobile-filter-backdrop d-none" id="mobileFilterBackdrop" onclick="app.toggleMobileFilter()"></div>
    <div class="mobile-filter-drawer" id="mobileFilterDrawer">
        <div class="drawer-header d-flex align-items-center justify-content-between p-3 border-bottom">
            <h6 class="mb-0 fw-bold text-dark"><i class='bx bx-filter-alt text-primary me-1'></i> 재고 필터 및 검색</h6>
            <button type="button" class="btn-close" onclick="app.toggleMobileFilter()"></button>
        </div>
        <div class="drawer-body p-3 overflow-auto" style="max-height: 65vh;">
            <!-- 자재분류 선택 -->
            <div class="mb-3">
                <label class="form-label fw-bold text-secondary small">자재 분류</label>
                <select class="form-select form-select-sm" id="mobileFilterCategory">
                    <option value="">전체 분류</option>
                </select>
            </div>

            <!-- 재고 보유 상태 -->
            <div class="mb-3">
                <label class="form-label fw-bold text-secondary small">재고 상태</label>
                <select class="form-select form-select-sm" id="mobileFilterStock">
                    <option value="all">전체 (품절 포함)</option>
                    <option value="in_stock">재고 보유 품목만 (> 0)</option>
                    <option value="out_of_stock">품절/재고 0인 품목</option>
                </select>
            </div>

            <!-- 검색 대상 -->
            <div class="mb-3">
                <label class="form-label fw-bold text-secondary small">검색 기준 대상</label>
                <select class="form-select form-select-sm" id="mobileFilterTarget">
                    <option value="">전체 대상 (품목/규격/위치/매입처)</option>
                    <option value="item">품목명만</option>
                    <option value="spec">규격만</option>
                    <option value="location">보관위치만</option>
                    <option value="supplier">매입처만</option>
                </select>
            </div>
        </div>
        <div class="drawer-footer p-3 border-top d-flex gap-2 bg-light">
            <button type="button" class="btn btn-outline-secondary flex-fill" onclick="app.resetMobileDrawerFilter()">초기화</button>
            <button type="button" class="btn btn-primary flex-fill fw-bold" onclick="app.applyMobileDrawerFilter()">필터 적용</button>
        </div>
    </div>

    <!-- 외부 라이브러리 (Bootstrap, SheetJS, GridResizer) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="../../Common/js/erp-grid-resizer.js"></script>
    <script src="app.js?v=20261007_1"></script>
</body>
</html>
