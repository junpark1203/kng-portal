<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 재고 현황 (물류 관리)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="../logistics-theme.css">
    <link rel="stylesheet" href="../../Common/css/erp-grid.css">
    <style>
        .inventory-ribbon-bar {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 6px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 6px;
        }
        .lot-sub-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11.5px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
        }
        .lot-sub-table th {
            background-color: #f1f5f9;
            color: #475569;
            font-weight: 600;
            font-size: 11px;
            padding: 3px 6px;
            border: 1px solid #e2e8f0;
            text-align: center;
            height: 24px;
            white-space: nowrap;
        }
        .lot-sub-table td {
            padding: 2px 6px;
            border: 1px solid #f1f5f9;
            height: 24px;
            vertical-align: middle;
            font-size: 11.5px;
        }
        .inventory-row {
            cursor: pointer;
            transition: background-color 0.1s ease;
        }
        .inventory-row:hover td {
            background-color: #f1f5f9 !important;
        }
        .inventory-row.row-expanded td {
            background-color: #eff6ff !important;
        }
        .lot-container-box {
            padding: 8px 14px 10px 48px;
            background-color: #f8fafc;
            border-bottom: 1px solid #cbd5e1;
        }
    </style>
</head>
<body class="bg-light">

<div class="container-fluid py-3 px-3">
    <!-- 상단 콤팩트 리본 바 (헤더 + 통계 배지 + 액션) -->
    <div class="inventory-ribbon-bar shadow-sm">
        <div class="d-flex align-items-center gap-3 flex-wrap">
            <h5 class="mb-0 fw-bold d-flex align-items-center gap-2 text-dark" style="font-size: 15px;">
                <i class='bx bx-box text-primary fs-5'></i> 통합 물류 실시간 재고
            </h5>
            
            <div class="d-flex align-items-center gap-2">
                <span class="badge bg-dark px-2 py-1" id="skuCountBadge" style="font-size: 11.5px;">관리 0 SKU</span>
                <span class="badge bg-primary bg-opacity-10 text-primary border border-primary px-2 py-1" id="totalQtyBadge" style="font-size: 11.5px;">총 재고: 0개</span>
            </div>

            <!-- 실시간 검색창 -->
            <div class="input-group input-group-sm" style="width: 240px;">
                <span class="input-group-text bg-white border-end-0 py-0 text-muted"><i class='bx bx-search'></i></span>
                <input type="text" class="form-control border-start-0" id="searchInput" placeholder="품목명 또는 규격 실시간 검색..." style="font-size: 12px; height: 26px;">
            </div>
        </div>

        <div class="d-flex align-items-center gap-2 flex-wrap">
            <button type="button" class="erp-tool-btn" onclick="window.ErpGridResizer.autoFitAll('inventoryTable')" title="데이터 길이에 맞춰 모든 열 너비를 자동으로 맞춥니다">
                <i class='bx bx-expand-horizontal text-primary'></i> 열 너비 자동맞춤
            </button>
            <button type="button" class="erp-tool-btn" onclick="window.ErpGridResizer.resetWidths('inventoryTable')" title="열 너비를 기본값으로 초기화합니다">
                <i class='bx bx-reset text-secondary'></i> 기본값 초기화
            </button>
            <a href="../inout/index.html" class="btn btn-outline-primary btn-sm py-0 px-2 fw-semibold d-inline-flex align-items-center gap-1" style="height: 24px; font-size: 11.5px;">
                <i class='bx bx-transfer'></i> 입출고내역 이동
            </a>
        </div>
    </div>

    <!-- ERP 고밀도 시트 그리드 -->
    <div class="erp-grid-wrapper shadow-sm" id="inventoryGridWrapper">
        <table id="inventoryTable" class="erp-sheet-table">
            <thead>
                <tr>
                    <th style="width: 32px;" class="text-center"></th>
                    <th style="width: 44px;" class="th-no">No.</th>
                    <th style="min-width: 220px;" class="text-start ps-2">품목명</th>
                    <th style="width: 150px;" class="text-start ps-2">규격</th>
                    <th style="width: 60px;" class="text-center">단위</th>
                    <th style="width: 120px;" class="text-end pe-3">총 재고수량</th>
                </tr>
            </thead>
            <tbody id="inventoryTbody">
                <tr><td colspan="6" class="text-center py-5 text-muted"><i class='bx bx-loader-alt bx-spin'></i> 재고 데이터를 불러오는 중입니다...</td></tr>
            </tbody>
            <tfoot id="inventoryTfoot" class="d-none">
                <tr>
                    <td colspan="2" class="text-center bg-light fw-bold text-secondary">합계</td>
                    <td colspan="3" class="ps-2 fw-bold text-dark" id="footSkuSummary">총 0개 품목</td>
                    <td class="text-end pe-3 text-primary fw-bold fs-6" id="footQtySummary">0</td>
                </tr>
            </tfoot>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../Common/js/erp-grid-resizer.js"></script>
<script src="app.js?v=2"></script>
</body>
</html>
